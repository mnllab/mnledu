<style>
  :root{
    --ink:#26384B; --steel:#2C6BA0; --muted:#5F7488;
    --hair:#E3E7EC; --canvas:#F4F5F7; --alert:#A34A3C;
  }
  html,body{ margin:0; }
  body{
    background:var(--canvas); color:var(--ink);
    font-family:'Pretendard',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  .btn{
    border:1px solid var(--hair); background:#fff; color:var(--ink);
    border-radius:6px; font-size:13px; line-height:1;
    padding:9px 13px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .btn:hover:not([disabled]){ border-color:#C3CCD6; background:#FAFBFC; }
  .btn:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .btn-primary:hover:not([disabled]){ background:#1D2C3B; border-color:#1D2C3B; }
  select.btn{ padding-right:26px; cursor:pointer; }

  #dropzone{
    border:2px dashed #CBD4DE; border-radius:12px; background:#fff;
    padding:56px 24px; text-align:center; cursor:pointer;
    transition:border-color .14s, background .14s;
  }
  #dropzone:hover{ border-color:var(--steel); background:#FAFCFD; }
  #dropzone.over{ border-color:var(--steel); background:#EDF4FA; }
  #dropzone:focus-visible{ outline:2px solid var(--steel); outline-offset:3px; }

  #stage{
    background:
      linear-gradient(45deg, #EFF1F4 25%, transparent 25%, transparent 75%, #EFF1F4 75%),
      linear-gradient(45deg, #EFF1F4 25%, #fff 25%, #fff 75%, #EFF1F4 75%);
    background-size:18px 18px; background-position:0 0, 9px 9px;
    border-radius:10px;
  }
  #canvas{ max-width:100%; max-height:48vh; height:auto; display:block; margin:0 auto; }

  textarea{
    width:100%; border:0; outline:none; resize:vertical;
    background:transparent; color:var(--ink);
    font-family:inherit; font-size:14.5px; line-height:1.85;
    min-height:clamp(260px, 40vh, 520px);
  }
  textarea::placeholder{ color:#9AA7B4; }

  /* 진행 표시 */
  .spinner{
    width:15px; height:15px; border-radius:999px;
    border:2px solid #D6DDE4; border-top-color:var(--steel);
    animation:spin .8s linear infinite; flex:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #barFill{ transition:width .2s ease; }

  .opt{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none; }
  .opt input{ accent-color:var(--steel); width:15px; height:15px; }

  #toast{
    opacity:0; transform:translate(-50%, 10px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>

<div id="toast" class="fixed bottom-8 left-1/2 rounded-md bg-ink px-4 py-2.5 text-[13px] font-medium text-white shadow-lg" role="status" aria-live="polite"></div>

<script>
(function () {
  const dropzone = document.getElementById('dropzone');
  const work     = document.getElementById('work');
  const picker   = document.getElementById('picker');
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d');
  const output   = document.getElementById('output');
  const langSel  = document.getElementById('lang');
  const progress = document.getElementById('progress');
  const progText = document.getElementById('progressText');
  const barFill  = document.getElementById('barFill');
  const errBox   = document.getElementById('errBox');
  const imgInfo  = document.getElementById('imgInfo');
  const charsEl  = document.getElementById('chars');
  const confInfo = document.getElementById('confInfo');
  const optJoin  = document.getElementById('optJoin');
  const copyFmt  = document.getElementById('copyFmt');
  const redoBtn  = document.getElementById('redoBtn');
  const newBtn   = document.getElementById('newBtn');

  let currentBlob = null;
  let rawText = '';
  let busy = false;

  /* ---------- 토스트 ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function showErr(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
  function clearErr() { errBox.textContent = ''; errBox.classList.add('hidden'); }

  /* ---------- 이미지 불러오기 ---------- */
  function loadBlob(blob) {
    if (!blob || blob.type.indexOf('image/') !== 0) { toast('이미지 파일이 아닙니다'); return; }
    if (busy) { toast('인식이 끝난 뒤에 넣어 주세요'); return; }

    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = function () {
      canvas.width = im.naturalWidth;
      canvas.height = im.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(im, 0, 0);
      imgInfo.textContent = im.naturalWidth + ' × ' + im.naturalHeight + ' px';

      dropzone.classList.add('hidden');
      work.classList.remove('hidden');
      work.classList.add('grid');
      newBtn.classList.remove('hidden');

      currentBlob = blob;
      URL.revokeObjectURL(url);
      recognize();
    };
    im.onerror = function () { URL.revokeObjectURL(url); toast('이미지를 읽지 못했습니다'); };
    im.src = url;
  }

  document.addEventListener('paste', function (ev) {
    const items = ev.clipboardData && ev.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image/') === 0) {
        ev.preventDefault();
        loadBlob(items[i].getAsFile());
        return;
      }
    }
  });

  dropzone.addEventListener('click', function () { picker.click(); });
  dropzone.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); picker.click(); }
  });
  picker.addEventListener('change', function (ev) {
    if (ev.target.files && ev.target.files[0]) loadBlob(ev.target.files[0]);
    picker.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (t) {
    dropzone.addEventListener(t, function (ev) { ev.preventDefault(); dropzone.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    dropzone.addEventListener(t, function (ev) {
      ev.preventDefault();
      if (t === 'dragleave' && dropzone.contains(ev.relatedTarget)) return;
      dropzone.classList.remove('over');
    });
  });
  dropzone.addEventListener('drop', function (ev) {
    if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]) loadBlob(ev.dataTransfer.files[0]);
  });
  ['dragover', 'drop'].forEach(function (t) {
    window.addEventListener(t, function (ev) { if (!dropzone.contains(ev.target)) ev.preventDefault(); });
  });

  /* ---------- OCR ---------- */
  // Tesseract가 알려주는 단계 이름을 우리말로 바꾼다
  const STATUS = {
    'loading tesseract core': '엔진 준비 중',
    'initializing tesseract': '엔진 시작 중',
    'loading language traineddata': '언어 데이터 내려받는 중',
    'initializing api': '인식기 준비 중',
    'recognizing text': '텍스트 추출 중'
  };

  function setProgress(status, ratio) {
    const pct = Math.round((ratio || 0) * 100);
    const label = STATUS[status] || status || '처리 중';
    progText.textContent = label + '… (' + pct + '%)';
    barFill.style.width = pct + '%';
  }

  async function recognize() {
    if (!currentBlob) return;
    if (typeof Tesseract === 'undefined') {
      showErr('OCR 엔진을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요. (Tesseract.js는 CDN에서 내려받습니다)');
      return;
    }

    busy = true;
    clearErr();
    progress.classList.remove('hidden');
    redoBtn.disabled = true;
    langSel.disabled = true;
    setProgress('initializing tesseract', 0);

    try {
      const result = await Tesseract.recognize(currentBlob, langSel.value, {
        logger: function (m) { setProgress(m.status, m.progress); }
      });

      rawText = (result && result.data && result.data.text) ? result.data.text : '';
      applyText();

      const conf = result && result.data && typeof result.data.confidence === 'number'
        ? Math.round(result.data.confidence) : null;
      confInfo.textContent = conf !== null ? '인식 신뢰도 ' + conf + '%' : '';
      confInfo.style.color = (conf !== null && conf < 70) ? 'var(--alert)' : 'var(--muted)';

      toast(rawText.trim() ? '추출이 끝났습니다' : '글자를 찾지 못했습니다');
    } catch (e) {
      showErr('인식에 실패했습니다 : ' + (e && e.message ? e.message : '알 수 없는 오류') +
              ' · 언어 데이터를 내려받지 못했을 수 있으니 연결 상태를 확인해 주세요.');
    } finally {
      busy = false;
      progress.classList.add('hidden');
      redoBtn.disabled = false;
      langSel.disabled = false;
    }
  }

  /* ---------- 줄바꿈 정리 ---------- */
  // OCR은 화면에 보이는 줄 단위로 끊어 내보내므로, 문단 안에서 끊긴 줄은 이어 주는 편이 읽기 좋다.
  // 한글 문서는 대부분 어절 경계에서 줄이 나뉘므로 이을 때 공백을 넣는다.
  // (빈 줄로 나뉜 문단과 목록 줄은 그대로 둔다)
  function tidy(text) {
    const blocks = text.replace(/\r\n?/g, '\n').split(/\n{2,}/);
    return blocks.map(function (b) {
      // 영문 단어가 줄 끝 하이픈으로 잘린 경우 먼저 붙인다 (infor-\nmation → information)
      let t = b.replace(/([A-Za-z])[-‐–]\n[ \t]*([a-z])/g, '$1$2');
      return t.replace(/\n[ \t]*/g, function (m, off, whole) {
        const after = whole.slice(off + m.length);
        const prev = whole.slice(0, off).slice(-1), next = after.slice(0, 1);
        if (!prev || !next) return '\n';
        // 목록·번호로 시작하는 줄은 줄바꿈을 유지한다
        if (/^\s*(?:[□■○●▪·•◇\-*]|\(?\d{1,2}[.)]|[①-⑮])/.test(after)) return '\n';
        return ' ';
      }).replace(/[ \t]{2,}/g, ' ').trim();
    }).filter(Boolean).join('\n\n');
  }

  function applyText() {
    output.value = optJoin.checked ? tidy(rawText) : rawText.replace(/\r\n?/g, '\n').trim();
    updateCount();
  }

  function updateCount() {
    charsEl.textContent = Array.from(output.value.replace(/\n/g, '')).length.toLocaleString('ko-KR');
  }

  optJoin.addEventListener('change', applyText);
  output.addEventListener('input', updateCount);
  langSel.addEventListener('change', function () { if (currentBlob) recognize(); });
  redoBtn.addEventListener('click', function () { if (currentBlob) recognize(); });

  newBtn.addEventListener('click', function () {
    if (busy) { toast('인식이 끝난 뒤에 눌러 주세요'); return; }
    currentBlob = null;
    rawText = '';
    output.value = '';
    confInfo.textContent = '';
    updateCount();
    clearErr();
    work.classList.add('hidden');
    work.classList.remove('grid');
    newBtn.classList.add('hidden');
    redoBtn.disabled = true;
    dropzone.classList.remove('hidden');
    dropzone.focus();
  });

  /* ---------- 복사 · 저장 ---------- */
  function formatted() {
    const t = output.value.replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n').replace(/[ \t]+$/gm, '');
    if (copyFmt.value === 'plain') return t;
    return t.split('\n').join('\r\n');
  }

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  document.getElementById('copyBtn').addEventListener('click', async function () {
    if (!output.value.trim()) { toast('복사할 결과가 없습니다'); return; }
    const text = formatted();
    try {
      if (navigator.clipboard) await navigator.clipboard.writeText(text);
      else throw new Error('no clipboard api');
      toast('복사되었습니다!');
    } catch (e) {
      if (legacyCopy(text)) toast('복사되었습니다!');
      else toast('브라우저가 막았습니다. 드래그해서 복사하세요');
    }
  });

  document.getElementById('saveBtn').addEventListener('click', function () {
    if (!output.value.trim()) { toast('저장할 내용이 없습니다'); return; }
    const d = new Date();
    const p = function (x) { return String(x).padStart(2, '0'); };
    const name = 'OCR추출_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
                 '_' + p(d.getHours()) + p(d.getMinutes()) + '.txt';
    try {
      // UTF-8 BOM : 윈도우 메모장에서 한글이 깨지지 않도록
      const blob = new Blob(['\uFEFF' + formatted()], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('저장되었습니다!');
    } catch (e) {
      toast('브라우저가 다운로드를 막았습니다');
    }
  });

  dropzone.focus();
})();
</script>
</body>
</html>
