<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAGR 연도별 추정 계산기</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    '#26384B',
          steel:  '#2C6BA0',
          muted:  '#5F7488',
          hair:   '#E3E7EC',
          canvas: '#F4F5F7',
          alert:  '#A34A3C',
          gain:   '#2C6BA0',
          loss:   '#A34A3C'
        },
        fontFamily: {
          sans: ['Pretendard', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
        }
      }
    }
  }
</script>

<style>
  :root{
    --ink:#26384B; --steel:#2C6BA0; --muted:#5F7488;
    --hair:#E3E7EC; --canvas:#F4F5F7; --alert:#A34A3C;
  }
  html,body{ margin:0; }
  body{
    background:var(--canvas); color:var(--ink);
    font-family:'Pretendard',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  .btn{
    border:1px solid var(--hair); background:#fff; color:var(--ink);
    border-radius:6px; font-size:13px; line-height:1; padding:9px 13px; cursor:pointer;
    transition:border-color .12s, background .12s, color .12s;
  }
  .btn:hover:not([disabled]){ border-color:#C3CCD6; background:#FAFBFC; }
  .btn:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .btn-primary:hover:not([disabled]){ background:#1D2C3B; border-color:#1D2C3B; }
  select.btn{ padding-right:26px; cursor:pointer; }

  .fld{
    width:100%; border:1px solid var(--hair); border-radius:6px; background:#fff;
    padding:9px 11px; font-size:14px; color:var(--ink); outline:none;
    font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;
    transition:border-color .12s;
  }
  .fld:focus{ border-color:var(--steel); }
  .fld.bad{ border-color:var(--alert); background:#FDF6F5; }
  .lab{ display:block; margin-bottom:6px; font-size:11px; color:var(--muted); }

  /* 라디오 세그먼트 */
  .seg{ display:inline-flex; border:1px solid var(--hair); border-radius:6px; overflow:hidden; background:#fff; }
  .seg label{
    padding:8px 14px; font-size:13px; cursor:pointer; color:var(--muted);
    transition:background .12s, color .12s;
  }
  .seg label:has(input:checked){ background:var(--ink); color:#fff; }
  .seg input{ position:absolute; opacity:0; width:0; height:0; }
  .seg label:hover{ color:var(--ink); }
  .seg label:has(input:checked):hover{ color:#fff; }

  /* 결과 카드 */
  #cagrCard{
    border:1px solid var(--hair); border-radius:10px; background:#fff;
    padding:20px 22px;
  }
  #cagrVal{
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:40px; font-weight:600; line-height:1.1; letter-spacing:-.02em;
  }

  /* 표 */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td{ padding:9px 12px; text-align:right; white-space:nowrap; }
  th:first-child, td:first-child{ text-align:left; }
  thead th{
    position:sticky; top:0; z-index:1;
    background:#26384B; color:#fff; font-weight:500; font-size:12px;
  }
  tbody tr{ border-bottom:1px solid var(--hair); }
  tbody tr:hover{ background:#FAFBFC; }
  tbody tr.anchor{ background:#F2F7FB; }
  tbody tr.anchor:hover{ background:#EAF2F9; }
  .tag{
    font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px;
    border:1px solid var(--hair); border-radius:4px; padding:1px 5px; color:var(--muted);
    margin-left:6px;
  }
  tbody tr.anchor .tag{ border-color:var(--steel); color:var(--steel); }
  #tableWrap{ max-height:56vh; overflow:auto; border:1px solid var(--hair); border-radius:8px; background:#fff; }

  #toast{
    opacity:0; transform:translate(-50%, 10px);
    transition:opacity .2s ease, transform .2s ease; pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<body class="font-sans text-ink">

<div class="mx-auto max-w-6xl px-4 sm:px-6 py-8 sm:py-12">

  <header class="mb-5 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-[19px] font-semibold tracking-tight">CAGR 연도별 추정 계산기</h1>
      <p class="mt-1 text-[13px] text-muted">두 시점의 값으로 연평균성장률을 구하고 연도별로 펼칩니다 · 저장되지 않음</p>
    </div>
    <button id="sampleBtn" class="btn shrink-0">예시</button>
  </header>

  <div class="grid gap-4 lg:grid-cols-[340px_1fr]">

    <!-- 좌 : 입력 -->
    <section class="space-y-4">

      <div class="rounded-lg border border-hair bg-white px-5 py-4">
        <p class="mb-3 text-[12px] font-medium tracking-wide text-muted">기준 데이터</p>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="lab" for="sy">시작 연도</label>
            <input id="sy" class="fld" type="number" step="1" value="2020">
          </div>
          <div>
            <label class="lab" for="sv">시작 값</label>
            <input id="sv" class="fld" type="text" inputmode="decimal" value="1000">
          </div>
          <div>
            <label class="lab" for="ey">끝 연도</label>
            <input id="ey" class="fld" type="number" step="1" value="2024">
          </div>
          <div>
            <label class="lab" for="ev">끝 값</label>
            <input id="ev" class="fld" type="text" inputmode="decimal" value="2000">
          </div>
        </div>
      </div>

      <div class="rounded-lg border border-hair bg-white px-5 py-4">
        <p class="mb-3 text-[12px] font-medium tracking-wide text-muted">표시 기간</p>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="lab" for="fy">시작 연도</label>
            <input id="fy" class="fld" type="number" step="1" value="2020">
          </div>
          <div>
            <label class="lab" for="ty">종료 연도</label>
            <input id="ty" class="fld" type="number" step="1" value="2029">
          </div>
        </div>
        <button id="resetSpan" class="btn mt-3 w-full py-2 text-[12px]">기준 기간 + 5년으로 되돌리기</button>
      </div>

      <div class="rounded-lg border border-hair bg-white px-5 py-4">
        <p class="mb-3 text-[12px] font-medium tracking-wide text-muted">수치 처리</p>

        <label class="lab">처리 방식</label>
        <div class="seg mb-4">
          <label><input type="radio" name="rmode" value="round" checked>반올림</label>
          <label><input type="radio" name="rmode" value="floor">버림</label>
          <label><input type="radio" name="rmode" value="ceil">올림</label>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="lab" for="dp">소수점 자릿수</label>
            <select id="dp" class="btn w-full py-2.5 text-[13px]">
              <option value="0">0자리 (정수)</option>
              <option value="1">1자리</option>
              <option value="2" selected>2자리</option>
              <option value="3">3자리</option>
            </select>
          </div>
          <div>
            <label class="lab" for="unit">단위 (선택)</label>
            <input id="unit" class="fld" type="text" placeholder="억원" autocomplete="off">
          </div>
        </div>

        <label class="mt-3 flex cursor-pointer select-none items-center gap-2 text-[13px]">
          <input type="checkbox" id="comma" checked style="accent-color:var(--steel);width:15px;height:15px;">
          화면에 천 단위 쉼표 표시
        </label>
      </div>

      <p id="errBox" class="hidden rounded-lg border border-hair bg-white px-5 py-3 text-[12.5px] leading-relaxed text-alert"></p>
    </section>

    <!-- 우 : 결과 -->
    <section class="space-y-4">

      <div id="cagrCard">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <p class="text-[12px] font-medium tracking-wide text-muted">연평균성장률 (CAGR)</p>
            <p id="cagrVal" class="mt-1.5">—</p>
            <p id="cagrDesc" class="mt-2 text-[12.5px] text-muted"></p>
          </div>
          <div class="grid gap-1.5 text-right text-[12px] text-muted">
            <span>기간 <b id="spanYears" class="num ml-1 text-[14px] font-medium text-ink">—</b></span>
            <span>총 증가율 <b id="totalRate" class="num ml-1 text-[14px] font-medium text-ink">—</b></span>
            <span>배수 <b id="multiple" class="num ml-1 text-[14px] font-medium text-ink">—</b></span>
          </div>
        </div>
      </div>

      <div id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>연도</th>
              <th id="thValue">추정 값</th>
              <th>전년 대비 증감</th>
              <th>성장률</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="rounded-lg border border-hair bg-white px-5 py-4">
        <div class="flex flex-wrap items-center gap-2">
          <span class="mr-1 text-[12px] font-medium tracking-wide text-muted">내보내기</span>
          <button id="txtBtn" class="btn">TXT 복사</button>
          <button id="mdBtn" class="btn">마크다운 복사</button>
          <button id="richBtn" class="btn btn-primary">엑셀·워드용 표 복사</button>
          <button id="csvBtn" class="btn">CSV 다운로드</button>
          <button id="xlsBtn" class="btn">엑셀 다운로드</button>
          <span id="rowInfo" class="num ml-auto text-[12px] text-muted"></span>
        </div>
        <p class="mt-2.5 text-[11.5px] leading-relaxed text-muted">
          CSV와 엑셀 파일에는 쉼표 없는 순수 숫자가 들어갑니다. 표 계산에 바로 쓸 수 있도록 한 것입니다.
        </p>
      </div>
    </section>
  </div>

  <footer class="mt-8 text-center text-[11px] tracking-wide text-muted">
    © 2026 Janggil Kim. All rights reserved.
  </footer>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 rounded-md bg-ink px-4 py-2.5 text-[13px] font-medium text-white shadow-lg" role="status" aria-live="polite"></div>

<script>
(function () {
  const $ = function (id) { return document.getElementById(id); };
  const syEl = $('sy'), svEl = $('sv'), eyEl = $('ey'), evEl = $('ev');
  const fyEl = $('fy'), tyEl = $('ty'), dpEl = $('dp'), unitEl = $('unit'), commaEl = $('comma');
  const tbody = $('tbody'), errBox = $('errBox');

  let rows = [];      // { year, value, diff, rate, anchor }
  let cagr = null;

  /* ---------- 토스트 ---------- */
  const toastEl = $('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }
  function showErr(m) { errBox.textContent = m; errBox.classList.remove('hidden'); }
  function clearErr() { errBox.textContent = ''; errBox.classList.add('hidden'); }

  /* ---------- 숫자 다루기 ---------- */
  // 1,234 처럼 쉼표가 섞여 들어와도 읽는다
  function parseNum(v) {
    const t = String(v == null ? '' : v).replace(/[,\s]/g, '');
    if (t === '' || isNaN(Number(t))) return NaN;
    return Number(t);
  }
  function mode() {
    const r = document.querySelector('input[name="rmode"]:checked');
    return r ? r.value : 'round';
  }
  // 선택한 방식과 자릿수로 값을 다듬는다
  function shape(v) {
    const dp = parseInt(dpEl.value, 10);
    const f = Math.pow(10, dp);
    const m = mode();
    const x = m === 'floor' ? Math.floor(v * f) / f
            : m === 'ceil'  ? Math.ceil(v * f) / f
            : Math.round(v * f) / f;
    return x;
  }
  function fixed(v) {
    const dp = parseInt(dpEl.value, 10);
    return (v === null || isNaN(v)) ? '' : v.toFixed(dp);
  }
  function disp(v) {
    if (v === null || isNaN(v)) return '';
    const dp = parseInt(dpEl.value, 10);
    return commaEl.checked
      ? v.toLocaleString('ko-KR', { minimumFractionDigits: dp, maximumFractionDigits: dp })
      : v.toFixed(dp);
  }
  function pct(v) { return (v === null || isNaN(v)) ? '' : (v * 100).toFixed(2) + '%'; }

  /* ---------- 계산 ---------- */
  function compute() {
    clearErr();
    [svEl, evEl, syEl, eyEl, fyEl, tyEl].forEach(function (el) { el.classList.remove('bad'); });

    const sy = parseNum(syEl.value), ey = parseNum(eyEl.value);
    const sv = parseNum(svEl.value), ev = parseNum(evEl.value);
    let fy = parseNum(fyEl.value), ty = parseNum(tyEl.value);

    const bad = [];
    if (isNaN(sy) || isNaN(ey)) bad.push('연도를 숫자로 입력해 주세요');
    if (isNaN(sv) || isNaN(ev)) bad.push('값을 숫자로 입력해 주세요');
    if (!isNaN(sy) && !isNaN(ey) && ey <= sy) { bad.push('끝 연도가 시작 연도보다 뒤여야 합니다'); eyEl.classList.add('bad'); }
    if (!isNaN(sv) && sv <= 0) { bad.push('시작 값은 0보다 커야 합니다'); svEl.classList.add('bad'); }
    if (!isNaN(ev) && ev <= 0) { bad.push('끝 값은 0보다 커야 합니다'); evEl.classList.add('bad'); }

    if (bad.length) {
      cagr = null; rows = [];
      showErr(bad.join(' · '));
      return;
    }

    const n = ey - sy;
    cagr = Math.pow(ev / sv, 1 / n) - 1;

    if (isNaN(fy)) fy = sy;
    if (isNaN(ty)) ty = ey + 5;
    if (ty < fy) { const t = fy; fy = ty; ty = t; }
    if (ty - fy > 200) { ty = fy + 200; showErr('표시 기간이 너무 길어 200년으로 줄였습니다'); }

    rows = [];
    let prev = null;
    for (let t = fy; t <= ty; t++) {
      const raw = sv * Math.pow(1 + cagr, t - sy);
      const v = shape(raw);
      // 증감과 성장률은 화면에 보이는 값끼리 계산해 표와 어긋나지 않게 한다
      const diff = prev === null ? null : v - prev;
      const rate = (prev === null || prev === 0) ? null : (v - prev) / prev;
      rows.push({ year: t, value: v, diff: diff, rate: rate, anchor: (t === sy || t === ey) });
      prev = v;
    }
  }

  /* ---------- 렌더링 ---------- */
  function render() {
    compute();

    const unit = unitEl.value.trim();
    $('thValue').textContent = unit ? '추정 값 (' + unit + ')' : '추정 값';

    // 요약 카드
    if (cagr === null) {
      $('cagrVal').textContent = '—';
      $('cagrVal').style.color = 'var(--muted)';
      $('cagrDesc').textContent = '';
      $('spanYears').textContent = '—';
      $('totalRate').textContent = '—';
      $('multiple').textContent = '—';
    } else {
      const sy = parseNum(syEl.value), ey = parseNum(eyEl.value);
      const sv = parseNum(svEl.value), ev = parseNum(evEl.value);
      const n = ey - sy;

      $('cagrVal').textContent = (cagr >= 0 ? '' : '') + (cagr * 100).toFixed(2) + '%';
      $('cagrVal').style.color = cagr >= 0 ? 'var(--steel)' : 'var(--alert)';
      $('cagrDesc').textContent = sy + '년 ' + disp(shape(sv)) + ' → ' + ey + '년 ' + disp(shape(ev)) +
                                  (unit ? ' ' + unit : '') + ' 기준';
      $('spanYears').textContent = n + '년';
      $('totalRate').textContent = ((ev / sv - 1) * 100).toFixed(2) + '%';
      $('multiple').textContent = (ev / sv).toFixed(2) + '배';
    }

    // 표
    tbody.innerHTML = '';
    rows.forEach(function (r) {
      const tr = document.createElement('tr');
      if (r.anchor) tr.className = 'anchor';

      const td1 = document.createElement('td');
      td1.textContent = r.year + '년';
      if (r.anchor) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = '기준';
        td1.appendChild(tag);
      }

      const td2 = document.createElement('td');
      td2.className = 'num font-medium';
      td2.textContent = disp(r.value);

      const td3 = document.createElement('td');
      td3.className = 'num';
      if (r.diff === null) { td3.textContent = '—'; td3.style.color = 'var(--muted)'; }
      else {
        td3.textContent = (r.diff >= 0 ? '+' : '−') + disp(Math.abs(r.diff));
        td3.style.color = r.diff >= 0 ? 'var(--steel)' : 'var(--alert)';
      }

      const td4 = document.createElement('td');
      td4.className = 'num';
      if (r.rate === null) { td4.textContent = '—'; td4.style.color = 'var(--muted)'; }
      else {
        td4.textContent = (r.rate >= 0 ? '+' : '−') + Math.abs(r.rate * 100).toFixed(2) + '%';
        td4.style.color = r.rate >= 0 ? 'var(--steel)' : 'var(--alert)';
      }

      [td1, td2, td3, td4].forEach(function (td) { tr.appendChild(td); });
      tbody.appendChild(tr);
    });

    $('rowInfo').textContent = rows.length ? rows.length + '개 연도' : '';
  }

  [syEl, svEl, eyEl, evEl, fyEl, tyEl, unitEl].forEach(function (el) { el.addEventListener('input', render); });
  dpEl.addEventListener('change', render);
  commaEl.addEventListener('change', render);
  document.querySelectorAll('input[name="rmode"]').forEach(function (r) { r.addEventListener('change', render); });

  $('resetSpan').addEventListener('click', function () {
    const sy = parseNum(syEl.value), ey = parseNum(eyEl.value);
    if (isNaN(sy) || isNaN(ey)) { toast('기준 연도를 먼저 입력해 주세요'); return; }
    fyEl.value = sy;
    tyEl.value = ey + 5;
    render();
  });

  $('sampleBtn').addEventListener('click', function () {
    syEl.value = 2020; svEl.value = '1,000';
    eyEl.value = 2024; evEl.value = '2,000';
    fyEl.value = 2020; tyEl.value = 2029;
    unitEl.value = '억원';
    render();
    toast('예시 값을 넣었습니다');
  });

  /* ---------- 내보내기 ---------- */
  function headers() {
    const unit = unitEl.value.trim();
    return ['연도', unit ? '추정 값(' + unit + ')' : '추정 값', '전년 대비 증감', '성장률(%)'];
  }
  // raw=true 면 쉼표 없는 순수 숫자 (엑셀에서 계산에 바로 쓰도록)
  function bodyRows(raw) {
    return rows.map(function (r) {
      return [
        String(r.year),
        raw ? fixed(r.value) : disp(r.value),
        r.diff === null ? '' : (raw ? fixed(r.diff) : (r.diff >= 0 ? '+' : '-') + disp(Math.abs(r.diff))),
        r.rate === null ? '' : (raw ? (r.rate * 100).toFixed(2) : (r.rate >= 0 ? '+' : '-') + Math.abs(r.rate * 100).toFixed(2) + '%')
      ];
    });
  }
  function summaryLines() {
    if (cagr === null) return [];
    const unit = unitEl.value.trim();
    const m = { round: '반올림', floor: '버림', ceil: '올림' }[mode()];
    return [
      'CAGR ' + (cagr * 100).toFixed(2) + '%  (' + syEl.value + '년 ' + svEl.value + ' → ' + eyEl.value + '년 ' + evEl.value + (unit ? ' ' + unit : '') + ')',
      '처리 : ' + m + ' · 소수점 ' + dpEl.value + '자리'
    ];
  }

  function toTxt() {
    if (!rows.length) return '';
    const lines = summaryLines();
    lines.push('');
    lines.push(headers().join('\t'));
    bodyRows(false).forEach(function (r) { lines.push(r.join('\t')); });
    return lines.join('\n');
  }

  function toMd() {
    if (!rows.length) return '';
    const h = headers();
    const lines = summaryLines().map(function (l) { return '- ' + l; });
    lines.push('');
    lines.push('| ' + h.join(' | ') + ' |');
    lines.push('|' + h.map(function (_, i) { return i === 0 ? ' --- ' : ' ---: '; }).join('|') + '|');
    bodyRows(false).forEach(function (r) { lines.push('| ' + r.join(' | ') + ' |'); });
    return lines.join('\n');
  }

  function toCsv() {
    if (!rows.length) return '';
    const esc = function (v) { return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const lines = [headers().map(esc).join(',')];
    bodyRows(true).forEach(function (r) { lines.push(r.map(esc).join(',')); });
    return lines.join('\r\n');
  }

  function toHtmlTable() {
    if (!rows.length) return '';
    const h = headers();
    let out = '<table border="1" style="border-collapse:collapse;font-family:Pretendard,sans-serif;font-size:13px">';
    out += '<thead><tr>' + h.map(function (x) {
      return '<th style="background:#26384B;color:#fff;padding:6px 10px;font-weight:500">' + x + '</th>';
    }).join('') + '</tr></thead><tbody>';
    bodyRows(true).forEach(function (r, i) {
      out += '<tr>' + r.map(function (c, j) {
        const align = j === 0 ? 'left' : 'right';
        return '<td style="padding:5px 10px;text-align:' + align + '">' + c + '</td>';
      }).join('') + '</tr>';
    });
    out += '</tbody></table>';
    return out;
  }

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  async function copyText(text, msg) {
    if (!text || !text.trim()) { toast('내보낼 표가 없습니다'); return; }
    try {
      if (navigator.clipboard) await navigator.clipboard.writeText(text);
      else throw new Error('no clipboard api');
      toast(msg);
    } catch (e) {
      if (legacyCopy(text)) toast(msg);
      else toast('브라우저가 막았습니다. 드래그해서 복사하세요');
    }
  }

  function download(text, name, mime, bom) {
    try {
      const blob = new Blob([(bom ? '\uFEFF' : '') + text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('저장되었습니다!');
    } catch (e) {
      toast('브라우저가 다운로드를 막았습니다');
    }
  }

  function stamp() {
    const d = new Date();
    const p = function (x) { return String(x).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  }

  $('txtBtn').addEventListener('click', function () { copyText(toTxt(), '탭 구분 텍스트로 복사했습니다!'); });
  $('mdBtn').addEventListener('click', function () { copyText(toMd(), '마크다운 표로 복사했습니다!'); });

  $('richBtn').addEventListener('click', async function () {
    if (!rows.length) { toast('내보낼 표가 없습니다'); return; }
    const html = toHtmlTable();
    const plain = toTxt();

    // text/html을 함께 담아야 엑셀·워드에서 표 모양 그대로 들어간다
    if (navigator.clipboard && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        toast('표 서식 그대로 복사했습니다! 엑셀에 바로 붙여넣으세요');
        return;
      } catch (e) { /* 아래 평문 복사로 넘어간다 */ }
    }
    copyText(plain, '탭 구분 텍스트로 복사했습니다 (엑셀에 붙이면 칸이 나뉩니다)');
  });

  $('csvBtn').addEventListener('click', function () {
    if (!rows.length) { toast('내보낼 표가 없습니다'); return; }
    // UTF-8 BOM : 엑셀에서 한글이 깨지지 않도록
    download(toCsv(), 'CAGR_' + stamp() + '.csv', 'text/csv;charset=utf-8', true);
  });

  $('xlsBtn').addEventListener('click', function () {
    if (!rows.length) { toast('내보낼 표가 없습니다'); return; }
    const html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>' +
                 toHtmlTable() + '</body></html>';
    download(html, 'CAGR_' + stamp() + '.xls', 'application/vnd.ms-excel;charset=utf-8', true);
  });

  render();
})();
</script>
</body>
</html>
