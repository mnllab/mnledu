<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음성 인식 노트패드</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    '#26384B',
          steel:  '#2C6BA0',
          muted:  '#5F7488',
          hair:   '#E3E7EC',
          canvas: '#F4F6F8',
          rec:    '#C0392B'
        },
        fontFamily: {
          sans: ['Pretendard', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
        }
      }
    }
  }
</script>

<style>
  :root{
    --ink:#26384B; --steel:#2C6BA0; --muted:#5F7488;
    --hair:#E3E7EC; --canvas:#F4F6F8; --rec:#C0392B;
  }
  html,body{ margin:0; }
  body{
    background:var(--canvas); color:var(--ink);
    font-family:'Pretendard',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  #notepad{
    width:100%; border:0; outline:none; resize:vertical;
    background:transparent; color:var(--ink);
    font-family:inherit; font-size:17px; line-height:1.8;
    min-height:clamp(280px, 48vh, 560px);
  }
  #notepad::placeholder{ color:#9AA7B4; }

  /* 인식 중 임시 결과 (회색) */
  #interim{
    color:var(--muted);
    font-size:17px; line-height:1.8;
    min-height:1.8em;
    white-space:pre-wrap; word-break:break-word;
  }
  #interim:empty::before{
    content:attr(data-idle);
    color:#B4BEC8;
  }
  .caret{
    display:inline-block; width:2px; height:1em;
    background:var(--rec); vertical-align:-2px; margin-left:2px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* 마이크 버튼 */
  #micBtn{
    position:relative; width:76px; height:76px; border-radius:999px;
    border:1px solid var(--hair); background:#fff; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .16s, border-color .16s, color .16s, transform .1s;
    box-shadow:0 1px 3px rgba(38,56,75,.08);
  }
  #micBtn:hover{ border-color:#C3CCD6; }
  #micBtn:active{ transform:scale(.97); }
  #micBtn:focus-visible{ outline:2px solid var(--steel); outline-offset:3px; }
  #micBtn.rec{ background:var(--rec); border-color:var(--rec); color:#fff; }
  #micBtn[disabled]{ opacity:.45; cursor:not-allowed; }

  /* 녹음 중 파동 */
  .wave{
    position:absolute; inset:0; border-radius:999px;
    border:2px solid var(--rec); opacity:0;
    pointer-events:none;
  }
  #micBtn.rec .wave{ animation:pulse 1.8s ease-out infinite; }
  #micBtn.rec .wave:nth-child(2){ animation-delay:.6s; }
  #micBtn.rec .wave:nth-child(3){ animation-delay:1.2s; }
  @keyframes pulse{
    0%   { transform:scale(1);   opacity:.55; }
    100% { transform:scale(1.85); opacity:0; }
  }

  .btn{
    border:1px solid var(--hair); background:#fff; color:var(--ink);
    border-radius:6px; font-size:13px; line-height:1;
    padding:8px 12px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .btn:hover{ border-color:#C3CCD6; background:#FAFBFC; }
  .btn:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }
  select.btn{ padding-right:26px; cursor:pointer; }

  #toast{
    opacity:0; transform:translate(-50%, 10px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>

<body class="font-sans text-ink">

<div class="mx-auto max-w-3xl px-4 sm:px-6 py-8 sm:py-12">

  <header class="mb-6 flex items-end justify-between gap-4">
    <div>
      <h1 class="text-[19px] font-semibold tracking-tight">음성 인식 노트패드</h1>
      <p class="mt-1 text-[13px] text-muted">말한 내용을 받아 적는 작업대 · 저장되지 않음</p>
    </div>
    <div class="flex shrink-0 flex-wrap items-center gap-2">
      <select id="copyFmt" class="btn" aria-label="복사 형식" title="복사·저장 형식">
        <option value="plain" selected>메모장용</option>
        <option value="word">워드·한글용</option>
        <option value="single">한 문단으로</option>
      </select>
      <button id="copyBtn" class="btn">전체 복사</button>
      <button id="saveBtn" class="btn">저장</button>
      <button id="resetBtn" class="btn">초기화</button>
    </div>
  </header>

  <!-- 노트 -->
  <section class="rounded-lg border border-hair bg-white shadow-[0_1px_2px_rgba(38,56,75,.05)]">
    <div class="flex items-center justify-between gap-3 border-b border-hair px-5 py-3">
      <span class="text-[12px] font-medium tracking-wide text-muted">받아쓰기</span>
      <span id="status" class="flex items-center gap-1.5 text-[12px] text-muted">
        <span id="dot" class="inline-block h-1.5 w-1.5 rounded-full bg-hair"></span>
        <span id="statusText">대기 중</span>
      </span>
    </div>

    <div class="px-5 pt-4 sm:px-7">
      <textarea id="notepad" placeholder="마이크 버튼을 누르고 말하거나, 여기에 직접 입력하세요" spellcheck="false"></textarea>
      <div id="interim" class="pb-1" data-idle="인식된 임시 문장이 여기에 회색으로 표시됩니다"></div>
    </div>

    <div class="flex flex-wrap gap-x-5 gap-y-1 border-t border-hair px-5 py-2.5 text-[12px] text-muted sm:px-7">
      <span>공백 포함 <b id="cAll" class="num ml-0.5 font-medium text-ink">0</b></span>
      <span>공백 제외 <b id="cNoSp" class="num ml-0.5 font-medium text-ink">0</b></span>
    </div>
  </section>

  <!-- 구간 나누기 -->
  <div class="mt-4 rounded-lg border border-hair bg-white px-5 py-3.5">
    <div class="flex flex-wrap items-center gap-x-5 gap-y-2.5 text-[12px] text-muted">
      <label class="flex cursor-pointer select-none items-center gap-2">
        <input type="checkbox" id="splitOn" checked style="accent-color:var(--steel);width:15px;height:15px;">
        <span class="text-[13px] font-medium text-ink">구간 나누기</span>
      </label>

      <span class="flex items-center gap-1.5">
        <input id="splitSize" type="number" min="50" max="2000" step="50" value="200"
               class="num w-20 rounded-md border border-hair px-2 py-1 text-right text-[12px] text-ink focus:border-steel focus:outline-none">
        자마다 문단 나누기
      </span>

      <span id="segInfo" class="num ml-auto"></span>
    </div>

    <div class="mt-2.5 h-[3px] w-full overflow-hidden rounded-full bg-hair">
      <div id="segBar" class="h-full w-0 bg-steel" style="transition:width .2s ease"></div>
    </div>

    <p class="mt-2 text-[11.5px] leading-relaxed text-muted">
      일정 분량이 쌓이면 빈 줄로 문단을 나눠 줍니다. 나중에 정리할 때 덩어리를 찾기 쉬워집니다.
    </p>
  </div>

  <!-- 마이크 -->
  <div class="mt-8 flex flex-col items-center gap-3">
    <button id="micBtn" aria-label="음성 인식 시작">
      <span class="wave"></span><span class="wave"></span><span class="wave"></span>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="18" x2="12" y2="22"></line>
      </svg>
    </button>

    <div class="flex items-center gap-2">
      <label for="lang" class="sr-only">인식 언어</label>
      <select id="lang" class="btn">
        <option value="ko-KR" selected>한국어</option>
        <option value="en-US">English</option>
      </select>
      <label id="localWrap" class="btn hidden cursor-pointer select-none">
        <input type="checkbox" id="localMode" class="mr-1.5 align-[-1px]">온디바이스
      </label>
      <button id="installBtn" class="btn hidden">모델 설치</button>
      <span id="hint" class="text-[12px] text-muted">누르면 인식 시작</span>
    </div>

    <p id="warn" class="hidden max-w-md text-center text-[12px] leading-relaxed text-rec"></p>

    <details class="mt-2 w-full max-w-xl">
      <summary class="cursor-pointer text-center text-[12px] text-muted hover:text-ink">진단 기록</summary>
      <div class="mt-2 rounded-lg border border-hair bg-white px-4 py-3">
        <p id="envInfo" class="mb-2 text-[11px] leading-relaxed text-muted"></p>
        <pre id="log" class="num m-0 max-h-52 overflow-auto whitespace-pre-wrap break-words text-[11px] leading-relaxed text-ink"></pre>
      </div>
    </details>
  </div>

  <footer class="mt-10 text-center text-[11px] tracking-wide text-muted">
    © 2026 Janggil Kim. All rights reserved.
  </footer>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 rounded-md bg-ink px-4 py-2.5 text-[13px] font-medium text-white shadow-lg" role="status" aria-live="polite"></div>

<script>
(function () {
  const notepad   = document.getElementById('notepad');
  const interimEl = document.getElementById('interim');
  const micBtn    = document.getElementById('micBtn');
  const langSel   = document.getElementById('lang');
  const hint      = document.getElementById('hint');
  const warn      = document.getElementById('warn');
  const dot       = document.getElementById('dot');
  const statusText= document.getElementById('statusText');
  const cAll      = document.getElementById('cAll');
  const cNoSp     = document.getElementById('cNoSp');
  const logEl     = document.getElementById('log');
  const envInfo   = document.getElementById('envInfo');

  /* ---------- 진단 기록 ---------- */
  const t0 = Date.now();
  function log(msg) {
    const s = ((Date.now() - t0) / 1000).toFixed(1).padStart(5, ' ');
    logEl.textContent += s + 's  ' + msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  const inIframe = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  const isFile = location.protocol === 'file:';
  // 크롬은 file:// 을 보안 컨텍스트로 보고하지만, 출처가 없어 음성 인식 결과를 돌려주지 않는다
  const insecure = !window.isSecureContext || isFile;
  const ua = navigator.userAgent;
  const isBrave = !!(navigator.brave && navigator.brave.isBrave);
  const isEdge = /Edg\//.test(ua);
  const isWhale = /Whale/.test(ua);
  const isFirefox = /Firefox/.test(ua);
  const isSafari = /Safari/.test(ua) && !/Chrome|Chromium|Edg\//.test(ua);

  envInfo.textContent =
    '보안 컨텍스트 ' + (window.isSecureContext ? 'O' : 'X') +
    ' · iframe ' + (inIframe ? 'O' : 'X') +
    ' · 주소 ' + location.protocol +
    ' · 온라인 ' + (navigator.onLine ? 'O' : 'X') + '\n' + ua;

  /* ---------- 토스트 ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function showWarn(msg) { warn.textContent = msg; warn.classList.remove('hidden'); }
  function clearWarn() { warn.textContent = ''; warn.classList.add('hidden'); }

  /* ---------- 글자 수 ---------- */
  function updateCount() {
    const t = notepad.value.replace(/\r/g, '').replace(/\n/g, '');
    cAll.textContent = Array.from(t).length.toLocaleString('ko-KR');
    cNoSp.textContent = Array.from(t.replace(/\s/g, '')).length.toLocaleString('ko-KR');
  }
  notepad.addEventListener('input', updateCount);

  function setStatus(state) {
    if (state === 'rec') {
      dot.className = 'inline-block h-1.5 w-1.5 rounded-full bg-rec';
      statusText.textContent = '인식 중';
      statusText.className = 'text-rec';
    } else {
      dot.className = 'inline-block h-1.5 w-1.5 rounded-full bg-hair';
      statusText.textContent = '대기 중';
      statusText.className = '';
    }
  }

  /* ---------- Web Speech API ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recording = false;    // 사용자가 의도한 상태
  let restarting = false;
  let gotAudio = false;     // 오디오 스트림이 열렸는지
  let gotResult = false;    // 결과를 한 번이라도 받았는지
  let emptySessions = 0;
  let audioTimer = null;
  let silentTimer = null;
  let fallbackTried = false;    // continuous 끄고 재시도했는지
  let useContinuous = true;
  let restartTimer = null;
  let startAttempts = 0;
  let watchdog = null;
  let lastEvent = 0;            // 마지막으로 인식 이벤트를 받은 시각
  let sessions = 0;             // 이어붙인 세션 수

  function mark() { lastEvent = Date.now(); }

  // 세션은 브라우저가 수시로 끊는다. 끊길 때마다 새 객체로 다시 붙인다.
  // 이전 객체를 재사용하면 InvalidStateError가 나면서 그대로 죽어버린다.
  function scheduleRestart(delay) {
    if (!recording) return;
    restarting = true;
    clearTimeout(restartTimer);
    restartTimer = setTimeout(function () {
      if (!recording) { restarting = false; return; }
      try { if (recognition) recognition.abort(); } catch (e) {}
      recognition = buildRecognition();
      try {
        recognition.start();
        sessions++;
        startAttempts = 0;
        mark();
        log('세션 재시작 #' + sessions);
      } catch (e) {
        startAttempts++;
        log('재시작 실패 · ' + e.name + ' (시도 ' + startAttempts + ')');
        if (startAttempts < 8) {
          scheduleRestart(Math.min(300 * startAttempts, 2000));  // 점점 간격을 늘려 재시도
        } else {
          restarting = false;
          recording = false;
          micBtn.classList.remove('rec');
          setStatus('idle');
          hint.textContent = '누르면 인식 시작';
          showWarn('인식 세션을 다시 연결하지 못했습니다. 마이크 버튼을 다시 눌러 주세요.');
        }
      }
    }, delay);
  }

  // 감시 타이머 : 아무 이벤트도 없이 멈춰 있으면 강제로 다시 붙인다
  function startWatchdog() {
    clearInterval(watchdog);
    watchdog = setInterval(function () {
      if (!recording || restarting) return;
      if (Date.now() - lastEvent > 12000) {
        log('12초간 무응답 → 강제 재연결');
        scheduleRestart(0);
      }
    }, 4000);
  }
  function stopWatchdog() { clearInterval(watchdog); watchdog = null; }

  // 탭을 다시 보게 됐을 때 세션이 죽어 있으면 되살린다
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && recording && !restarting) {
      if (Date.now() - lastEvent > 3000) {
        log('탭 복귀 → 세션 재연결');
        scheduleRestart(0);
      }
    }
  });

  // Chrome 138+ 온디바이스 인식 지원 여부
  const localWrap  = document.getElementById('localWrap');
  const localMode  = document.getElementById('localMode');
  const installBtn = document.getElementById('installBtn');
  const canLocal = !!(SR && ('processLocally' in SR.prototype));
  let localState = 'unknown';   // unavailable | downloadable | downloading | available

  if (canLocal) {
    localWrap.classList.remove('hidden');
    log('온디바이스 인식 지원됨');
    checkLocal();
  }

  function checkLocal() {
    if (!canLocal || !SR.available) return;
    SR.available({ langs: [langSel.value], processLocally: true }).then(function (v) {
      localState = v;
      log('온디바이스 모델(' + langSel.value + ') 상태 · ' + v);
      applyLocalState();
    }).catch(function (e) {
      log('모델 상태 확인 실패 · ' + (e && e.name));
    });
  }

  function applyLocalState() {
    if (localState === 'available') {
      installBtn.classList.add('hidden');
      localMode.disabled = false;
    } else if (localState === 'downloadable' || localState === 'downloading') {
      installBtn.classList.remove('hidden');
      installBtn.textContent = localState === 'downloading' ? '모델 내려받는 중' : '모델 설치';
      installBtn.disabled = (localState === 'downloading');
      localMode.checked = false;
      localMode.disabled = true;
    } else {
      installBtn.classList.add('hidden');
      localMode.disabled = true;
      localMode.checked = false;
    }
  }

  installBtn.addEventListener('click', function () {
    if (!SR.install) { showWarn('이 브라우저는 모델 설치를 지원하지 않습니다.'); return; }
    installBtn.disabled = true;
    installBtn.textContent = '내려받는 중';
    log('모델 설치 시작 · ' + langSel.value);
    showWarn('한국어 인식 모델을 내려받고 있습니다. 용량이 커서 몇 분 걸릴 수 있습니다. 창을 닫지 마세요.');

    SR.install({ langs: [langSel.value], processLocally: true }).then(function (ok) {
      log('설치 결과 · ' + ok);
      if (ok) {
        // 곧바로 true를 반환해도 실제 설치가 안 된 경우가 있어 상태를 다시 확인한다
        SR.available({ langs: [langSel.value], processLocally: true }).then(function (v) {
          log('설치 후 재확인 · ' + v);
          localState = v;
          applyLocalState();
          if (v === 'available') {
            localMode.disabled = false;
            localMode.checked = true;
            clearWarn();
            toast('모델 설치 완료. 온디바이스로 인식합니다');
          } else {
            showWarn('설치가 완료로 보고됐지만 모델이 준비되지 않았습니다 (' + v + '). ' + envHint());
          }
        }).catch(function () {
          localState = 'available';
          applyLocalState();
        });
      } else {
        installBtn.disabled = false;
        installBtn.textContent = '모델 설치';
        showWarn('모델 설치가 완료되지 않았습니다. 잠시 후 다시 시도해 주세요.');
      }
    }).catch(function (e) {
      log('설치 실패 · ' + (e && e.name) + ' / ' + (e && e.message));
      installBtn.disabled = false;
      installBtn.textContent = '모델 설치';
      showWarn('모델 설치에 실패했습니다 (' + (e && e.name) + '). 크롬을 최신 버전으로 올린 뒤 다시 시도해 주세요.');
    });
  });

  log('SpeechRecognition ' + (SR ? '사용 가능' : '없음'));

  function envHint() {
    if (isFile) return 'file:// 로 연 페이지에서는 마이크 권한이 있어도 인식 결과가 오지 않습니다. 이 파일이 있는 폴더에서 터미널을 열고 python3 -m http.server 를 실행한 뒤, 크롬에서 http://localhost:8000/voice-notepad.html 로 접속해 주세요.';
    if (inIframe) return '이 페이지가 미리보기 창(iframe) 안에 있습니다. 파일을 내려받아 브라우저 탭에서 직접 열어 주세요.';
    if (insecure) return 'https 또는 localhost 에서만 동작합니다.';
    if (isBrave) return 'Brave는 구글 음성 인식 서버 연결을 기본 차단합니다. Chrome으로 열어 주세요.';
    if (isWhale) return '웨일 등 일부 크로미움 브라우저는 음성 인식 API 키가 없어 결과가 오지 않습니다. Chrome으로 열어 주세요.';
    if (isEdge) return 'Edge는 Windows 설정 > 개인 정보 > 음성에서 온라인 음성 인식이 켜져 있어야 합니다.';
    if (isFirefox) return 'Firefox는 이 기능을 지원하지 않습니다. Chrome으로 열어 주세요.';
    if (isSafari) return 'Safari는 지원이 제한적입니다. Chrome으로 열어 주세요.';
    return '주소창 왼쪽 자물쇠에서 마이크 권한을 확인해 주세요.';
  }

  if (!SR) {
    micBtn.disabled = true;
    hint.textContent = '이 브라우저는 음성 인식을 지원하지 않습니다';
    showWarn('Web Speech API를 지원하지 않는 브라우저입니다. Chrome으로 열어 주세요. 직접 입력은 그대로 사용할 수 있습니다.');
  }

  // 확정 문장을 노트 끝에 누적
  function appendFinal(text) {
    const chunk = text.trim();
    if (!chunk) return;

    const cur = notepad.value;
    const needsSpace = cur.length > 0 && !/\s$/.test(cur);
    notepad.value = cur + (needsSpace ? ' ' : '') + chunk;
    notepad.scrollTop = notepad.scrollHeight;
    updateCount();

    segChars += chunk.length;
    updateSeg();
    checkSplit();
  }

  /* ---------- 구간 나누기 ---------- */
  // 한 세션을 오래 끌면 인식 품질이 떨어지고 결과가 끊긴다.
  // 정해진 분량이 쌓이면 문단을 나누고 세션을 새로 연결해 매번 깨끗한 상태에서 시작한다.
  const splitOn    = document.getElementById('splitOn');
  const splitSize  = document.getElementById('splitSize');
  const segInfo    = document.getElementById('segInfo');
  const segBar     = document.getElementById('segBar');

  let segChars = 0;      // 현재 구간에 쌓인 글자 수
  let segNo = 1;         // 구간 번호

  function segLimit() {
    const n = parseInt(splitSize.value, 10);
    return (!n || n < 50) ? 200 : Math.min(2000, n);
  }

  function updateSeg() {
    const lim = segLimit();
    if (!splitOn.checked) {
      segInfo.textContent = '';
      segBar.style.width = '0%';
      return;
    }
    segInfo.textContent = '구간 ' + segNo + ' · ' + segChars + ' / ' + lim + '자';
    segBar.style.width = Math.min(100, segChars / lim * 100) + '%';
  }

  function checkSplit() {
    if (!splitOn.checked || !recording) return;
    if (segChars < segLimit()) return;

    // 문단을 나눈다
    segNo++;
    notepad.value = notepad.value.replace(/\s+$/, '') + '\n\n';
    notepad.scrollTop = notepad.scrollHeight;

    segChars = 0;
    updateSeg();
    updateCount();

    // 세션은 그대로 두고 문단만 나눈다.
    // 여기서 세션을 다시 열면 인식이 통째로 멈추는 문제가 있었다.
    log('구간 ' + (segNo - 1) + ' 마감 (문단 나눔)');
  }

  splitOn.addEventListener('change', updateSeg);
  splitSize.addEventListener('input', updateSeg);

  function buildRecognition() {
    const r = new SR();
    r.lang = langSel.value;
    r.continuous = useContinuous;
    r.interimResults = true;
    r.maxAlternatives = 1;
    if (canLocal && localMode.checked && localState === 'available') {
      try { r.processLocally = true; log('온디바이스 모드로 시작'); } catch (e) {}
    }

    r.onstart = function () {
      restarting = false;
      startAttempts = 0;
      mark();
      setStatus('rec');
      hint.textContent = '다시 누르면 중지';
      log('onstart · lang=' + r.lang);

      // 오디오가 실제로 열리는지 확인 : 2초 안에 audiostart가 없으면 환경 문제
      clearTimeout(audioTimer);
      audioTimer = setTimeout(function () {
        if (recording && !gotAudio) {
          log('경고 : audiostart 없음');
          showWarn('마이크 입력이 열리지 않습니다. ' + envHint());
        }
      }, 2000);
    };

    r.onaudiostart  = function () { gotAudio = true; mark(); log('onaudiostart (마이크 열림)'); clearWarn(); };
    r.onsoundstart  = function () { mark(); log('onsoundstart (소리 감지)'); };
    r.onspeechstart = function () {
      mark();
      log('onspeechstart (음성 감지)');
      // 음성이 감지된 뒤에도 결과가 오지 않으면 서버 응답이 없는 것이다
      clearTimeout(silentTimer);
      silentTimer = setTimeout(function () {
        if (!recording || gotResult) return;
        if (!fallbackTried) {
          fallbackTried = true;
          log('결과 없음 → continuous 끄고 재시도');
          showWarn('서버 응답이 없어 짧게 끊어 인식하는 방식으로 다시 시도합니다.');
          useContinuous = false;
          scheduleRestart(400);
        } else {
          log('폴백 후에도 결과 없음');
          if (canLocal && localState !== 'available') {
            showWarn('음성은 정상적으로 들어오지만 인식 서버 응답이 없습니다. 아래 모델 설치 버튼으로 온디바이스 인식 모델을 내려받으면 서버 없이 동작합니다.');
          } else {
            showWarn('음성은 정상적으로 들어오지만 인식 결과가 돌아오지 않습니다. ' + envHint());
          }
        }
      }, 8000);
    };
    r.onspeechend   = function () { mark(); log('onspeechend'); };
    r.onaudioend    = function () { mark(); log('onaudioend'); };
    r.onnomatch     = function () { log('onnomatch (인식 실패)'); };

    r.onresult = function (ev) {
      gotResult = true;
      emptySessions = 0;
      mark();
      clearTimeout(silentTimer);
      clearWarn();
      let interim = '';
      let finals = 0;
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (res.isFinal) { appendFinal(res[0].transcript); finals++; }
        else interim += res[0].transcript;
      }
      log('onresult · 확정 ' + finals + '건, 임시 ' + interim.length + '자');
      interimEl.textContent = interim;
      if (interim) {
        const caret = document.createElement('span');
        caret.className = 'caret';
        interimEl.appendChild(caret);
      }
    };

    r.onerror = function (ev) {
      log('onerror · ' + ev.error + (ev.message ? ' / ' + ev.message : ''));
      if (ev.error === 'aborted') return;

      if (ev.error === 'no-speech') {
        emptySessions++;
        if (emptySessions >= 3 && !gotResult) {
          showWarn('소리가 감지되지 않습니다. 시스템 입력 장치와 마이크 음소거 상태를 확인해 주세요.');
        }
        return;
      }
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        stop();
        showWarn('마이크 사용이 차단되었습니다. ' + envHint());
      } else if (ev.error === 'network') {
        stop();
        showWarn('음성 인식 서버에 연결하지 못했습니다. 이 기능은 음성을 구글 서버로 보내 처리합니다. ' + envHint());
      } else if (ev.error === 'language-not-supported') {
        showWarn('선택한 언어를 이 브라우저가 지원하지 않습니다.');
      } else {
        showWarn('음성 인식 오류 : ' + ev.error);
      }
    };

    r.onend = function () {
      log('onend' + (recording ? ' → 자동 재시작' : ''));
      mark();
      clearTimeout(audioTimer);
      if (recording && !restarting) {
        if (!gotResult) {
          emptySessions++;
          if (emptySessions >= 3) showWarn('인식이 시작되자마자 반복해서 끊깁니다. ' + envHint());
        }
        scheduleRestart(250);
        return;
      }
      if (!recording) {
        setStatus('idle');
        hint.textContent = '누르면 인식 시작';
      }
    };

    return r;
  }

  // 사용자의 클릭 흐름 안에서 곧바로 start를 호출한다.
  // (Promise 이후에 호출하면 일부 브라우저가 사용자 제스처로 인정하지 않는다)
  function start() {
    if (!SR || recording) return;
    clearWarn();
    gotAudio = false;
    gotResult = false;
    emptySessions = 0;
    fallbackTried = false;
    useContinuous = true;
    recognition = buildRecognition();
    recording = true;
    sessions = 1;
    startAttempts = 0;
    segChars = 0;
    segNo = 1;
    updateSeg();
    mark();
    startWatchdog();
    micBtn.classList.add('rec');
    micBtn.setAttribute('aria-label', '음성 인식 중지');
    try {
      recognition.start();
      log('start() 호출');
    } catch (e) {
      recording = false;
      micBtn.classList.remove('rec');
      log('start() 예외 · ' + e.name + ' / ' + e.message);
      showWarn('음성 인식을 시작하지 못했습니다 (' + e.name + '). 새로고침 후 다시 시도해 주세요.');
    }
  }

  function stop() {
    if (!recording) return;
    recording = false;
    restarting = false;
    clearTimeout(audioTimer);
    clearTimeout(silentTimer);
    clearTimeout(restartTimer);
    stopWatchdog();
    micBtn.classList.remove('rec');
    micBtn.setAttribute('aria-label', '음성 인식 시작');
    setStatus('idle');
    hint.textContent = '누르면 인식 시작';
    log('사용자 중지');

    const pending = interimEl.textContent.trim();
    if (pending) appendFinal(pending);
    interimEl.textContent = '';

    try { recognition.stop(); } catch (e) {}
    // 서버 응답을 기다리며 onend가 오지 않는 경우가 있어 강제 종료를 예약한다
    const stuck = recognition;
    setTimeout(function () {
      if (!recording && stuck) {
        try { stuck.abort(); log('응답 없어 강제 종료'); } catch (e) {}
      }
    }, 1200);
  }

  micBtn.addEventListener('click', function () {
    if (recording) stop(); else start();
  });

  langSel.addEventListener('change', function () {
    log('언어 변경 · ' + langSel.value);
    checkLocal();
    if (recording) { stop(); setTimeout(start, 400); }
    toast(langSel.value === 'ko-KR' ? '한국어로 인식합니다' : 'Recognizing in English');
  });

  localMode.addEventListener('change', function () {
    if (localMode.checked && localState !== 'available') {
      localMode.checked = false;
      showWarn('먼저 인식 모델을 설치해야 합니다. 옆의 모델 설치 버튼을 눌러 주세요.');
    }
  });

  /* ---------- 복사 · 저장 · 초기화 ---------- */
  // 워드·한글은 CRLF를 문단 구분으로 읽는다. LF만 넘기면 문단이 붙거나 빈 줄이 더 생긴다.
  const copyFmt = document.getElementById('copyFmt');

  function formatted() {
    const mode = copyFmt.value;
    const text = notepad.value.replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n').replace(/[ \t]+$/gm, '');
    if (mode === 'plain') return text.replace(/\n{3,}/g, '\n\n').trim();

    const lines = text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (mode === 'single') return lines.join(' ').replace(/[ \t]{2,}/g, ' ');
    return lines.join('\r\n');
  }

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  document.getElementById('copyBtn').addEventListener('click', async function () {
    if (!notepad.value.trim()) { toast('복사할 내용이 없습니다'); return; }
    const text = formatted();
    try {
      if (navigator.clipboard) await navigator.clipboard.writeText(text);
      else throw new Error('no clipboard api');
      toast(copyFmt.value === 'word' ? '워드용으로 복사되었습니다!' : '복사되었습니다!');
    } catch (e) {
      if (legacyCopy(text)) toast('복사되었습니다!');
      else toast('브라우저가 막았습니다. Ctrl+A → Ctrl+C를 사용하세요');
    }
  });

  document.getElementById('saveBtn').addEventListener('click', function () {
    if (!notepad.value.trim()) { toast('저장할 내용이 없습니다'); return; }
    const d = new Date();
    const p = function (n) { return String(n).padStart(2, '0'); };
    const name = '받아쓰기_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
                 '_' + p(d.getHours()) + p(d.getMinutes()) + '.txt';
    try {
      // UTF-8 BOM : 윈도우 메모장에서 한글이 깨지지 않도록
      const blob = new Blob(['\uFEFF' + formatted()], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('저장되었습니다!');
    } catch (e) {
      toast('브라우저가 다운로드를 막았습니다');
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!notepad.value.trim() || confirm('작성된 내용을 모두 지웁니다. 계속할까요?')) {
      notepad.value = '';
      interimEl.textContent = '';
      segChars = 0;
      segNo = 1;
      updateCount();
      updateSeg();
      notepad.focus();
    }
  });

  updateCount();
  updateSeg();
  setStatus('idle');

  if (SR && (inIframe || insecure)) {
    showWarn('마이크가 차단될 수 있는 환경입니다. ' + envHint());
  }
})();
</script>
</body>
</html>
