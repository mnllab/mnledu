<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마트 리스트 포맷터</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    '#26384B',
          steel:  '#2C6BA0',
          muted:  '#5F7488',
          hair:   '#E3E7EC',
          canvas: '#F4F5F7'
        },
        fontFamily: {
          sans: ['Pretendard', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
        }
      }
    }
  }
</script>

<style>
  :root{
    --ink:#26384B; --steel:#2C6BA0; --muted:#5F7488;
    --hair:#E3E7EC; --canvas:#F4F5F7;
  }
  html,body{ margin:0; }
  body{
    background:var(--canvas); color:var(--ink);
    font-family:'Pretendard',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  textarea{
    width:100%; border:0; outline:none; resize:vertical;
    background:transparent; color:var(--ink);
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:13.5px; line-height:1.8;
    min-height:clamp(280px, 46vh, 560px);
  }
  textarea::placeholder{ color:#9AA7B4; font-family:'Pretendard',sans-serif; font-size:14px; }

  .btn{
    border:1px solid var(--hair); background:#fff; color:var(--ink);
    border-radius:6px; font-size:13px; line-height:1;
    padding:9px 13px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .btn:hover{ border-color:#C3CCD6; background:#FAFBFC; }
  .btn:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }
  .btn-primary{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .btn-primary:hover{ background:#1D2C3B; border-color:#1D2C3B; }
  select.btn{ padding-right:26px; cursor:pointer; }

  .opt{
    display:flex; align-items:center; gap:9px;
    border:1px solid var(--hair); border-radius:8px; background:#fff;
    padding:11px 13px; cursor:pointer; user-select:none;
    font-size:13.5px;
    transition:border-color .12s, background .12s;
  }
  .opt:hover{ border-color:#C3CCD6; }
  .opt.on{ border-color:var(--steel); background:#F5F9FC; }
  .opt input{ accent-color:var(--steel); width:16px; height:16px; flex:none; cursor:pointer; }

  .fld{
    border:1px solid var(--hair); border-radius:6px; background:#fff;
    padding:8px 11px; font-size:13px; color:var(--ink);
    font-family:'JetBrains Mono',ui-monospace,monospace;
    outline:none; width:100%;
    transition:border-color .12s;
  }
  .fld:focus{ border-color:var(--steel); }

  #toast{
    opacity:0; transform:translate(-50%, 10px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<body class="font-sans text-ink">

<div class="mx-auto max-w-6xl px-4 sm:px-6 py-8 sm:py-12">

  <header class="mb-6 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-[19px] font-semibold tracking-tight">스마트 리스트 포맷터</h1>
      <p class="mt-1 text-[13px] text-muted">줄 단위 목록을 다듬고 원하는 형태로 · 저장되지 않음</p>
    </div>
    <div class="flex shrink-0 flex-wrap items-center gap-2">
      <select id="copyFmt" class="btn" aria-label="복사 형식" title="복사·저장 형식">
        <option value="plain" selected>메모장용</option>
        <option value="word">워드·한글용</option>
      </select>
      <button id="sampleBtn" class="btn">예시</button>
      <button id="saveBtn" class="btn">저장</button>
      <button id="resetOpt" class="btn">옵션 초기화</button>
    </div>
  </header>

  <!-- 제어부 -->
  <div class="mb-4 rounded-lg border border-hair bg-white px-5 py-4">
    <div class="grid gap-2.5 sm:grid-cols-2 lg:grid-cols-4">
      <label class="opt on"><input type="checkbox" id="optBlank" checked>빈 줄 제거</label>
      <label class="opt on"><input type="checkbox" id="optTrim" checked>양쪽 공백 제거</label>
      <label class="opt"><input type="checkbox" id="optUniq">중복 제거</label>
      <label class="opt"><input type="checkbox" id="optSort">오름차순 정렬</label>
    </div>

    <div class="mt-4 grid gap-x-6 gap-y-4 sm:grid-cols-2 lg:grid-cols-4">
      <div>
        <label for="prefix" class="mb-1.5 block text-[12px] text-muted">접두사</label>
        <input id="prefix" class="fld" placeholder='예) "' autocomplete="off">
      </div>
      <div>
        <label for="suffix" class="mb-1.5 block text-[12px] text-muted">접미사</label>
        <input id="suffix" class="fld" placeholder='예) ",' autocomplete="off">
      </div>
      <div>
        <label for="delim" class="mb-1.5 block text-[12px] text-muted">구분자 (한 줄로 합칠 때)</label>
        <input id="delim" class="fld" value=", " autocomplete="off">
      </div>
      <div class="flex items-end">
        <label class="opt w-full"><input type="checkbox" id="optJoin">한 줄로 합치기</label>
      </div>
    </div>

    <div class="mt-3 grid gap-2.5 sm:grid-cols-2 lg:grid-cols-4">
      <label class="opt"><input type="checkbox" id="optNum">번호 매기기</label>
      <div class="flex items-center gap-2 text-[12px] text-muted">
        <label for="numFmt" class="shrink-0">번호 형식</label>
        <select id="numFmt" class="btn py-1.5 text-[12px]">
          <option value="dot" selected>1.</option>
          <option value="paren">1)</option>
          <option value="bracket">[1]</option>
          <option value="dash">- </option>
        </select>
      </div>
    </div>
  </div>

  <!-- 본문 -->
  <div class="grid gap-4 md:grid-cols-2">

    <section class="rounded-lg border border-hair bg-white shadow-[0_1px_2px_rgba(38,56,75,.04)]">
      <div class="flex items-center justify-between gap-3 border-b border-hair px-5 py-2.5">
        <span class="text-[12px] font-medium tracking-wide text-muted">원본</span>
        <button id="clearInput" class="btn px-2.5 py-1.5 text-[12px]">지우기</button>
      </div>
      <div class="px-5 pt-4 sm:px-6">
        <textarea id="input" placeholder="여기에 텍스트를 줄바꿈하여 붙여넣으세요" spellcheck="false"></textarea>
      </div>
      <div class="border-t border-hair px-5 py-2.5 text-[12px] text-muted sm:px-6">
        <span>줄 <b id="inLines" class="num ml-0.5 font-medium text-ink">0</b></span>
      </div>
    </section>

    <section class="rounded-lg border border-hair bg-white shadow-[0_1px_2px_rgba(38,56,75,.04)]">
      <div class="flex items-center justify-between gap-3 border-b border-hair px-5 py-2.5">
        <span class="text-[12px] font-medium tracking-wide text-muted">결과</span>
        <button id="copyBtn" class="btn btn-primary px-2.5 py-1.5 text-[12px]">결과 복사</button>
      </div>
      <div class="px-5 pt-4 sm:px-6">
        <textarea id="output" readonly spellcheck="false" placeholder="가공된 결과가 여기에 표시됩니다"></textarea>
      </div>
      <div class="flex flex-wrap gap-x-5 gap-y-1 border-t border-hair px-5 py-2.5 text-[12px] text-muted sm:px-6">
        <span>항목 <b id="outLines" class="num ml-0.5 font-medium text-ink">0</b></span>
        <span>글자 <b id="outChars" class="num ml-0.5 font-medium text-ink">0</b></span>
        <span id="dropInfo" class="num"></span>
      </div>
    </section>
  </div>

  <footer class="mt-8 text-center text-[11px] tracking-wide text-muted">
    © 2026 Janggil Kim. All rights reserved.
  </footer>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 rounded-md bg-ink px-4 py-2.5 text-[13px] font-medium text-white shadow-lg" role="status" aria-live="polite"></div>

<script>
(function () {
  const input     = document.getElementById('input');
  const output    = document.getElementById('output');
  const optBlank  = document.getElementById('optBlank');
  const optTrim   = document.getElementById('optTrim');
  const optUniq   = document.getElementById('optUniq');
  const optSort   = document.getElementById('optSort');
  const optJoin   = document.getElementById('optJoin');
  const optNum    = document.getElementById('optNum');
  const numFmt    = document.getElementById('numFmt');
  const prefix    = document.getElementById('prefix');
  const suffix    = document.getElementById('suffix');
  const delim     = document.getElementById('delim');
  const copyFmt   = document.getElementById('copyFmt');
  const inLines   = document.getElementById('inLines');
  const outLines  = document.getElementById('outLines');
  const outChars  = document.getElementById('outChars');
  const dropInfo  = document.getElementById('dropInfo');

  const boxes = [optBlank, optTrim, optUniq, optSort, optJoin, optNum];

  /* ---------- 가공 ---------- */
  // 순서 : 공백 정리 → 빈 줄 제거 → 중복 제거 → 정렬 → 번호 → 접두·접미 → 합치기
  // 접두·접미를 번호보다 나중에 붙여야 "1. 항목" 전체를 감쌀 수 있고,
  // 중복 제거를 정렬보다 먼저 해야 원본 순서 기준으로 첫 항목이 남는다.
  function process(src) {
    let lines = src.replace(/\r\n?/g, '\n').split('\n');
    const rawCount = lines.length;

    if (optTrim.checked) lines = lines.map(function (l) { return l.trim(); });
    if (optBlank.checked) lines = lines.filter(function (l) { return l.trim() !== ''; });

    let removed = 0;
    if (optUniq.checked) {
      const seen = {};
      const kept = [];
      lines.forEach(function (l) {
        const key = optTrim.checked ? l : l.trim();
        if (Object.prototype.hasOwnProperty.call(seen, key)) { removed++; return; }
        seen[key] = true;
        kept.push(l);
      });
      lines = kept;
    }

    if (optSort.checked) {
      lines = lines.slice().sort(function (a, b) {
        return a.localeCompare(b, 'ko', { numeric: true, sensitivity: 'base' });
      });
    }

    const p = prefix.value, s = suffix.value;
    lines = lines.map(function (l, i) {
      let body = l;
      if (optNum.checked) {
        const n = i + 1;
        const mark = numFmt.value === 'paren'   ? n + ') '
                   : numFmt.value === 'bracket' ? '[' + n + '] '
                   : numFmt.value === 'dash'    ? '- '
                   : n + '. ';
        body = mark + body;
      }
      return p + body + s;
    });

    const count = lines.length;
    const text = optJoin.checked ? lines.join(delim.value) : lines.join('\n');

    return { text: text, count: count, removed: removed, rawCount: rawCount };
  }

  function fmt(n) { return n.toLocaleString('ko-KR'); }

  function render() {
    let r = { text: '', count: 0, removed: 0, rawCount: 0 };
    try {
      r = process(input.value);
    } catch (e) {
      r.text = '(처리 중 오류가 발생했습니다 : ' + (e && e.message ? e.message : '알 수 없음') + ')';
    }

    output.value = r.text;

    inLines.textContent = fmt(input.value ? input.value.split('\n').length : 0);
    outLines.textContent = fmt(r.count);
    outChars.textContent = fmt(Array.from(r.text.replace(/\n/g, '')).length);
    dropInfo.textContent = r.removed ? '중복 ' + fmt(r.removed) + '건 제거' : '';

    // 토글 강조와 종속 컨트롤 상태
    document.querySelectorAll('.opt').forEach(function (el) {
      const box = el.querySelector('input');
      if (box) el.classList.toggle('on', box.checked);
    });
    delim.disabled = !optJoin.checked;
    delim.style.opacity = optJoin.checked ? '1' : '.5';
    numFmt.disabled = !optNum.checked;
    numFmt.style.opacity = optNum.checked ? '1' : '.5';
  }

  input.addEventListener('input', render);
  boxes.forEach(function (b) { b.addEventListener('change', render); });
  [prefix, suffix, delim].forEach(function (f) { f.addEventListener('input', render); });
  numFmt.addEventListener('change', render);

  /* ---------- 토스트 ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  /* ---------- 복사 · 저장 ---------- */
  // 워드·한글은 CRLF를 문단 구분으로 읽는다
  function formatted() {
    const t = output.value;
    if (copyFmt.value === 'plain') return t;
    return t.replace(/\r\n?/g, '\n').split('\n').join('\r\n');
  }

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  document.getElementById('copyBtn').addEventListener('click', async function () {
    if (!output.value.trim()) { toast('복사할 결과가 없습니다'); return; }
    const text = formatted();
    try {
      if (navigator.clipboard) await navigator.clipboard.writeText(text);
      else throw new Error('no clipboard api');
      toast('복사되었습니다!');
    } catch (e) {
      if (legacyCopy(text)) toast('복사되었습니다!');
      else toast('브라우저가 막았습니다. 드래그해서 복사하세요');
    }
  });

  document.getElementById('saveBtn').addEventListener('click', function () {
    if (!output.value.trim()) { toast('저장할 내용이 없습니다'); return; }
    const d = new Date();
    const p2 = function (x) { return String(x).padStart(2, '0'); };
    const name = '리스트_' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) +
                 '_' + p2(d.getHours()) + p2(d.getMinutes()) + '.txt';
    try {
      // UTF-8 BOM : 윈도우 메모장에서 한글이 깨지지 않도록
      const blob = new Blob(['\uFEFF' + formatted()], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('저장되었습니다!');
    } catch (e) {
      toast('브라우저가 다운로드를 막았습니다');
    }
  });

  /* ---------- 지우기 · 초기화 · 예시 ---------- */
  document.getElementById('clearInput').addEventListener('click', function () {
    input.value = '';
    render();
    input.focus();
  });

  document.getElementById('resetOpt').addEventListener('click', function () {
    optBlank.checked = true;
    optTrim.checked = true;
    optUniq.checked = false;
    optSort.checked = false;
    optJoin.checked = false;
    optNum.checked = false;
    numFmt.value = 'dot';
    prefix.value = '';
    suffix.value = '';
    delim.value = ', ';
    render();
    toast('옵션을 처음 상태로 되돌렸습니다');
  });

  document.getElementById('sampleBtn').addEventListener('click', function () {
    input.value =
      '스마트 그리퍼\n' +
      '  서보 액추에이터  \n' +
      '\n' +
      '감속기 모듈\n' +
      '스마트 그리퍼\n' +
      '\n' +
      '하모닉 드라이브\n' +
      '감속기 모듈';
    render();
    input.focus();
  });

  render();
  input.focus();
})();
</script>
</body>
</html>
