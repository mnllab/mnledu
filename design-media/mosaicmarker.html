<style>

  #stage{

<script>
(function () {
  const dropzone = document.getElementById('dropzone');
  const editor   = document.getElementById('editor');
  const toolbar  = document.getElementById('toolbar');
  const picker   = document.getElementById('picker');
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d', { willReadFrequently: true });
  const undoBtn  = document.getElementById('undoBtn');
  const info     = document.getElementById('info');
  const blockEl  = document.getElementById('block');
  const blockVal = document.getElementById('blockVal');
  const mosaicOpt= document.getElementById('mosaicOpt');
  const markerOpt= document.getElementById('markerOpt');

  let tool = 'mosaic';
  let marker = '255,235,59';
  let history = [];          // 되돌릴 상태들 (ImageData)
  let original = null;       // 원본 상태
  let dragging = false;
  let sx = 0, sy = 0, cx = 0, cy = 0;
  let baseState = null;      // 드래그 중 미리보기의 바탕

  const MAX_HISTORY = 25;

  /* ---------- 토스트 ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  /* ---------- 이미지 불러오기 ---------- */
  function loadBlob(blob) {
    if (!blob || blob.type.indexOf('image/') !== 0) { toast('이미지 파일이 아닙니다'); return; }
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = function () {
      canvas.width = im.naturalWidth;
      canvas.height = im.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(im, 0, 0);

      original = ctx.getImageData(0, 0, canvas.width, canvas.height);
      history = [];
      updateUndo();

      dropzone.classList.add('hidden');
      editor.classList.remove('hidden');
      toolbar.classList.remove('hidden');
      document.getElementById('newBtn').classList.remove('hidden');

      URL.revokeObjectURL(url);
      toast('이미지를 불러왔습니다 · 끌어서 영역을 지정하세요');
    };
    im.onerror = function () { URL.revokeObjectURL(url); toast('이미지를 읽지 못했습니다'); };
    im.src = url;
  }

  document.addEventListener('paste', function (ev) {
    const items = ev.clipboardData && ev.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image/') === 0) {
        ev.preventDefault();
        loadBlob(items[i].getAsFile());
        return;
      }
    }
  });

  dropzone.addEventListener('click', function () { picker.click(); });
  dropzone.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); picker.click(); }
  });
  picker.addEventListener('change', function (ev) {
    if (ev.target.files && ev.target.files[0]) loadBlob(ev.target.files[0]);
    picker.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (t) {
    dropzone.addEventListener(t, function (ev) { ev.preventDefault(); dropzone.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    dropzone.addEventListener(t, function (ev) {
      ev.preventDefault();
      if (t === 'dragleave' && dropzone.contains(ev.relatedTarget)) return;
      dropzone.classList.remove('over');
    });
  });
  dropzone.addEventListener('drop', function (ev) {
    if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]) loadBlob(ev.dataTransfer.files[0]);
  });
  ['dragover', 'drop'].forEach(function (t) {
    window.addEventListener(t, function (ev) { if (!dropzone.contains(ev.target)) ev.preventDefault(); });
  });

  /* ---------- 좌표 변환 : 화면 크기와 캔버스 실제 크기가 다르다 ---------- */
  function pos(ev) {
    const r = canvas.getBoundingClientRect();
    return {
      x: Math.round((ev.clientX - r.left) * (canvas.width / r.width)),
      y: Math.round((ev.clientY - r.top) * (canvas.height / r.height))
    };
  }

  function rect() {
    const x = Math.min(sx, cx), y = Math.min(sy, cy);
    const w = Math.abs(cx - sx), h = Math.abs(cy - sy);
    return {
      x: Math.max(0, x), y: Math.max(0, y),
      w: Math.min(w, canvas.width - Math.max(0, x)),
      h: Math.min(h, canvas.height - Math.max(0, y))
    };
  }

  /* ---------- 모자이크 : 블록 단위 평균색으로 덮는다 ---------- */
  function pixelate(r, size) {
    if (r.w < 1 || r.h < 1) return;
    const img = ctx.getImageData(r.x, r.y, r.w, r.h);
    const d = img.data;

    for (let by = 0; by < r.h; by += size) {
      for (let bx = 0; bx < r.w; bx += size) {
        const bw = Math.min(size, r.w - bx);
        const bh = Math.min(size, r.h - by);

        let sr = 0, sg = 0, sb = 0, sa = 0, n = 0;
        for (let y = 0; y < bh; y++) {
          for (let x = 0; x < bw; x++) {
            const i = ((by + y) * r.w + (bx + x)) * 4;
            sr += d[i]; sg += d[i + 1]; sb += d[i + 2]; sa += d[i + 3];
            n++;
          }
        }
        if (!n) continue;
        const cr = sr / n, cg = sg / n, cb = sb / n, ca = sa / n;

        for (let y = 0; y < bh; y++) {
          for (let x = 0; x < bw; x++) {
            const i = ((by + y) * r.w + (bx + x)) * 4;
            d[i] = cr; d[i + 1] = cg; d[i + 2] = cb; d[i + 3] = ca;
          }
        }
      }
    }
    ctx.putImageData(img, r.x, r.y);
  }

  /* ---------- 형광펜 ---------- */
  function highlight(r) {
    if (r.w < 1 || r.h < 1) return;
    ctx.save();
    // multiply를 쓰면 아래 글자가 비쳐 보여 형광펜처럼 칠해진다
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(' + marker + ',0.55)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.restore();
  }

  /* ---------- 드래그 ---------- */
  function pushHistory() {
    history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (history.length > MAX_HISTORY) history.shift();
    updateUndo();
  }

  function updateUndo() {
    undoBtn.disabled = history.length === 0;
    info.textContent = history.length
      ? '편집 ' + history.length + '단계 · Ctrl+Z로 되돌릴 수 있습니다'
      : '가릴 영역을 마우스로 끌어서 지정하세요';
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (!original) return;
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    const p = pos(ev);
    sx = cx = p.x; sy = cy = p.y;
    dragging = true;
    baseState = ctx.getImageData(0, 0, canvas.width, canvas.height);
  });

  canvas.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    const p = pos(ev);
    cx = p.x; cy = p.y;

    // 바탕을 되돌린 뒤 선택 영역을 미리 보여준다
    ctx.putImageData(baseState, 0, 0);
    const r = rect();
    if (r.w < 1 || r.h < 1) return;

    if (tool === 'mosaic') pixelate(r, parseInt(blockEl.value, 10));
    else highlight(r);

    ctx.save();
    ctx.strokeStyle = 'rgba(44,107,160,.9)';
    ctx.lineWidth = Math.max(1, canvas.width / 800);
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(r.x + .5, r.y + .5, r.w, r.h);
    ctx.restore();
  });

  function finish(ev) {
    if (!dragging) return;
    dragging = false;

    const r = rect();
    ctx.putImageData(baseState, 0, 0);

    if (r.w < 2 || r.h < 2) { baseState = null; return; }   // 클릭만 한 경우

    history.push(baseState);
    if (history.length > MAX_HISTORY) history.shift();

    if (tool === 'mosaic') pixelate(r, parseInt(blockEl.value, 10));
    else highlight(r);

    baseState = null;
    updateUndo();
  }

  canvas.addEventListener('pointerup', finish);
  canvas.addEventListener('pointercancel', finish);
  canvas.addEventListener('pointerleave', function (ev) { if (dragging) finish(ev); });

  /* ---------- 실행 취소 ---------- */
  function undo() {
    if (!history.length) return;
    const prev = history.pop();
    ctx.putImageData(prev, 0, 0);
    updateUndo();
  }

  undoBtn.addEventListener('click', undo);
  document.addEventListener('keydown', function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') {
      if (!original) return;
      ev.preventDefault();
      undo();
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!original) return;
    if (!history.length || confirm('편집한 내용을 모두 지우고 원본으로 되돌립니다.')) {
      ctx.putImageData(original, 0, 0);
      history = [];
      updateUndo();
      toast('원본으로 되돌렸습니다');
    }
  });

  document.getElementById('newBtn').addEventListener('click', function () {
    original = null;
    history = [];
    editor.classList.add('hidden');
    toolbar.classList.add('hidden');
    document.getElementById('newBtn').classList.add('hidden');
    dropzone.classList.remove('hidden');
    dropzone.focus();
  });

  /* ---------- 툴 전환 ---------- */
  document.querySelectorAll('.tool').forEach(function (b) {
    b.addEventListener('click', function () {
      tool = b.dataset.tool;
      document.querySelectorAll('.tool').forEach(function (x) { x.classList.toggle('on', x === b); });
      mosaicOpt.classList.toggle('hidden', tool !== 'mosaic');
      mosaicOpt.classList.toggle('flex', tool === 'mosaic');
      markerOpt.classList.toggle('hidden', tool !== 'marker');
      markerOpt.classList.toggle('flex', tool === 'marker');
    });
  });

  blockEl.addEventListener('input', function () { blockVal.textContent = blockEl.value; });

  document.querySelectorAll('.swatch').forEach(function (s) {
    s.addEventListener('click', function () {
      marker = s.dataset.c;
      document.querySelectorAll('.swatch').forEach(function (x) { x.classList.toggle('on', x === s); });
    });
  });

  /* ---------- 내보내기 ---------- */
  function stamp() {
    const d = new Date();
    const p = function (x) { return String(x).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  }

  document.getElementById('copyBtn').addEventListener('click', function () {
    if (!original) { toast('먼저 이미지를 붙여넣어 주세요'); return; }
    if (!navigator.clipboard || !window.ClipboardItem) {
      toast('이 브라우저는 이미지 복사를 지원하지 않습니다. 다운로드를 사용해 주세요');
      return;
    }
    try {
      // ClipboardItem에 Promise를 넘겨야 사파리에서도 사용자 제스처가 유지된다
      const item = new ClipboardItem({
        'image/png': new Promise(function (resolve, reject) {
          canvas.toBlob(function (b) { b ? resolve(b) : reject(new Error('blob 실패')); }, 'image/png');
        })
      });
      navigator.clipboard.write([item]).then(function () {
        toast('이미지가 복사되었습니다! 붙여넣기로 바로 쓰세요');
      }).catch(function (e) {
        toast('복사가 차단되었습니다 (' + (e && e.name ? e.name : '오류') + '). 다운로드를 사용해 주세요');
      });
    } catch (e) {
      toast('복사에 실패했습니다. 다운로드를 사용해 주세요');
    }
  });

  document.getElementById('dlBtn').addEventListener('click', function () {
    if (!original) { toast('먼저 이미지를 붙여넣어 주세요'); return; }
    try {
      canvas.toBlob(function (blob) {
        if (!blob) { toast('이미지를 만들지 못했습니다'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '가림처리_' + stamp() + '.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        toast('저장되었습니다!');
      }, 'image/png');
    } catch (e) {
      toast('브라우저가 다운로드를 막았습니다');
    }
  });

  dropzone.focus();
})();
</script>
</body>
</html>
