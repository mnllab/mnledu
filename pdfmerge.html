<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 병합 · 추출기</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    '#26384B',
          steel:  '#2C6BA0',
          muted:  '#5F7488',
          hair:   '#E3E7EC',
          canvas: '#F4F5F7',
          alert:  '#A34A3C'
        },
        fontFamily: {
          sans: ['Pretendard', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
        }
      }
    }
  }
</script>

<style>
  :root{
    --ink:#26384B; --steel:#2C6BA0; --muted:#5F7488;
    --hair:#E3E7EC; --canvas:#F4F5F7; --alert:#A34A3C;
  }
  html,body{ margin:0; }
  body{
    background:var(--canvas); color:var(--ink);
    font-family:'Pretendard',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  .btn{
    border:1px solid var(--hair); background:#fff; color:var(--ink);
    border-radius:6px; font-size:13px; line-height:1;
    padding:9px 13px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .btn:hover:not([disabled]){ border-color:#C3CCD6; background:#FAFBFC; }
  .btn:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .btn-primary{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .btn-primary:hover:not([disabled]){ background:#1D2C3B; border-color:#1D2C3B; }

  .tab{
    border:1px solid var(--hair); background:#fff; color:var(--muted);
    border-radius:6px; font-size:13.5px; line-height:1; padding:10px 16px;
    cursor:pointer; transition:all .12s;
  }
  .tab:hover{ color:var(--ink); border-color:#C3CCD6; }
  .tab.on{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .tab:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }

  .drop{
    border:2px dashed #CBD4DE; border-radius:12px; background:#fff;
    padding:40px 24px; text-align:center; cursor:pointer;
    transition:border-color .14s, background .14s;
  }
  .drop:hover{ border-color:var(--steel); background:#FAFCFD; }
  .drop.over{ border-color:var(--steel); background:#EDF4FA; }
  .drop:focus-visible{ outline:2px solid var(--steel); outline-offset:3px; }

  /* 파일 행 */
  .row{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--hair); border-radius:8px; background:#fff;
    padding:11px 13px; transition:border-color .12s, box-shadow .12s, opacity .12s;
  }
  .row.dragging{ opacity:.4; }
  .row.dropTarget{ border-color:var(--steel); box-shadow:0 0 0 2px rgba(44,107,160,.12); }
  .row .grip{ cursor:grab; color:#B0BAC5; flex:none; }
  .row .grip:active{ cursor:grabbing; }
  .row .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
  .row .meta{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; color:var(--muted); }
  .iconBtn{
    width:26px; height:26px; border-radius:5px; border:1px solid var(--hair);
    background:#fff; color:var(--muted); font-size:12px; line-height:1; cursor:pointer; flex:none;
    transition:border-color .12s, color .12s, background .12s;
  }
  .iconBtn:hover:not([disabled]){ border-color:var(--steel); color:var(--steel); }
  .iconBtn[disabled]{ opacity:.3; cursor:not-allowed; }
  .iconBtn.del:hover{ border-color:var(--alert); color:#fff; background:var(--alert); }

  .fld{
    border:1px solid var(--hair); border-radius:6px; background:#fff;
    padding:10px 12px; font-size:14px; color:var(--ink); outline:none; width:100%;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    transition:border-color .12s;
  }
  .fld:focus{ border-color:var(--steel); }

  .opt{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none; font-size:13px; }
  .opt input{ accent-color:var(--steel); width:15px; height:15px; }

  #toast{
    opacity:0; transform:translate(-50%, 10px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<body class="font-sans text-ink">

<div class="mx-auto max-w-4xl px-4 sm:px-6 py-8 sm:py-12">

  <header class="mb-5">
    <h1 class="text-[19px] font-semibold tracking-tight">PDF 병합 · 추출기</h1>
    <p class="mt-1 text-[13px] text-muted">파일이 서버로 올라가지 않고 브라우저 안에서 처리됩니다 · 용량 제한 없음</p>
  </header>

  <!-- 탭 -->
  <div class="mb-4 flex flex-wrap gap-2">
    <button class="tab on" data-tab="merge">PDF 병합</button>
    <button class="tab" data-tab="split">PDF 추출</button>
  </div>

  <!-- 병합 -->
  <section id="tabMerge">
    <div id="dropMerge" class="drop" tabindex="0" role="button" aria-label="PDF 파일 추가">
      <svg class="mx-auto mb-3" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--steel)" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
      </svg>
      <p class="text-[14px] font-medium">합칠 PDF 파일들을 끌어다 놓거나 클릭해서 추가하세요</p>
      <p class="mt-1.5 text-[12px] text-muted">여러 개를 한 번에 넣을 수 있습니다</p>
      <input type="file" id="pickMerge" accept="application/pdf,.pdf" multiple class="hidden">
    </div>

    <div id="listWrap" class="mt-4 hidden">
      <div class="mb-2 flex flex-wrap items-baseline justify-between gap-2 text-[12px] text-muted">
        <span>파일 <b id="fileCount" class="num text-ink">0</b>개 · 전체 <b id="pageTotal" class="num text-ink">0</b>쪽</span>
        <span>행을 끌거나 화살표로 순서를 바꿉니다</span>
      </div>
      <div id="fileList" class="grid gap-2"></div>

      <div class="mt-4 flex flex-wrap items-center justify-end gap-2">
        <button id="clearMerge" class="btn">전체 비우기</button>
        <button id="mergeBtn" class="btn btn-primary">병합 및 다운로드</button>
      </div>
    </div>
  </section>

  <!-- 추출 -->
  <section id="tabSplit" class="hidden">
    <div id="dropSplit" class="drop" tabindex="0" role="button" aria-label="PDF 파일 선택">
      <svg class="mx-auto mb-3" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--steel)" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="9" y1="15" x2="15" y2="15"></line>
      </svg>
      <p class="text-[14px] font-medium">페이지를 뽑아낼 PDF 하나를 넣어 주세요</p>
      <p class="mt-1.5 text-[12px] text-muted">끌어다 놓거나 클릭해서 선택</p>
      <input type="file" id="pickSplit" accept="application/pdf,.pdf" class="hidden">
    </div>

    <div id="splitPanel" class="mt-4 hidden rounded-lg border border-hair bg-white px-5 py-4">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-hair pb-3">
        <span id="splitName" class="text-[13.5px] font-medium"></span>
        <span id="splitMeta" class="num text-[12px] text-muted"></span>
      </div>

      <label for="ranges" class="mb-1.5 block text-[12px] text-muted">추출할 페이지 범위</label>
      <input id="ranges" class="fld" placeholder="예) 1-3, 5, 7-10" autocomplete="off">

      <div class="mt-2 flex flex-wrap items-center gap-2">
        <button class="btn px-2.5 py-1.5 text-[12px]" data-quick="all">전체</button>
        <button class="btn px-2.5 py-1.5 text-[12px]" data-quick="odd">홀수쪽</button>
        <button class="btn px-2.5 py-1.5 text-[12px]" data-quick="even">짝수쪽</button>
        <button class="btn px-2.5 py-1.5 text-[12px]" data-quick="half1">앞 절반</button>
        <button class="btn px-2.5 py-1.5 text-[12px]" data-quick="half2">뒤 절반</button>
      </div>

      <p id="rangeInfo" class="mt-2.5 text-[12.5px] text-muted"></p>

      <div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-hair pt-4">
        <label class="opt"><input type="checkbox" id="splitEach">범위마다 파일 나눠 저장</label>
        <div class="flex flex-wrap gap-2">
          <button id="clearSplit" class="btn">비우기</button>
          <button id="splitBtn" class="btn btn-primary">추출 및 다운로드</button>
        </div>
      </div>
    </div>
  </section>

  <p id="errBox" class="mt-4 hidden rounded-lg border border-hair bg-white px-5 py-3 text-[12.5px] leading-relaxed text-alert"></p>

  <footer class="mt-8 text-center text-[11px] tracking-wide text-muted">
    © 2026 Janggil Kim. All rights reserved.
  </footer>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 rounded-md bg-ink px-4 py-2.5 text-[13px] font-medium text-white shadow-lg" role="status" aria-live="polite"></div>

<script>
(function () {
  const PDFLib = window.PDFLib;

  const tabMerge  = document.getElementById('tabMerge');
  const tabSplit  = document.getElementById('tabSplit');
  const listWrap  = document.getElementById('listWrap');
  const fileList  = document.getElementById('fileList');
  const fileCount = document.getElementById('fileCount');
  const pageTotal = document.getElementById('pageTotal');
  const errBox    = document.getElementById('errBox');

  const splitPanel= document.getElementById('splitPanel');
  const splitName = document.getElementById('splitName');
  const splitMeta = document.getElementById('splitMeta');
  const rangesEl  = document.getElementById('ranges');
  const rangeInfo = document.getElementById('rangeInfo');
  const splitEach = document.getElementById('splitEach');

  let files = [];        // { name, size, bytes, pages }
  let splitDoc = null;   // { name, bytes, pages }

  /* ---------- 토스트 · 오류 ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  function showErr(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
  function clearErr() { errBox.textContent = ''; errBox.classList.add('hidden'); }

  if (!PDFLib) {
    showErr('PDF 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요. (pdf-lib은 CDN에서 내려받습니다)');
  }

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }
  function stamp() {
    const d = new Date();
    const p = function (x) { return String(x).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  }
  function download(bytes, name) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  // 암호가 걸린 PDF도 열어 본다. 열리지 않으면 파일별로 이유를 알린다
  async function readPdf(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const doc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
    return { bytes: bytes, pages: doc.getPageCount() };
  }

  /* ---------- 탭 ---------- */
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === b); });
      const merge = b.dataset.tab === 'merge';
      tabMerge.classList.toggle('hidden', !merge);
      tabSplit.classList.toggle('hidden', merge);
      clearErr();
    });
  });

  /* ---------- 공통 : 드롭존 ---------- */
  function bindDrop(zone, picker, handler) {
    zone.addEventListener('click', function () { picker.click(); });
    zone.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); picker.click(); }
    });
    picker.addEventListener('change', function (ev) {
      if (ev.target.files && ev.target.files.length) handler(ev.target.files);
      picker.value = '';
    });
    ['dragenter', 'dragover'].forEach(function (t) {
      zone.addEventListener(t, function (ev) { ev.preventDefault(); zone.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      zone.addEventListener(t, function (ev) {
        ev.preventDefault();
        if (t === 'dragleave' && zone.contains(ev.relatedTarget)) return;
        zone.classList.remove('over');
      });
    });
    zone.addEventListener('drop', function (ev) {
      if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) handler(ev.dataTransfer.files);
    });
  }
  ['dragover', 'drop'].forEach(function (t) {
    window.addEventListener(t, function (ev) {
      if (ev.target.closest && ev.target.closest('.drop')) return;
      ev.preventDefault();
    });
  });

  function isPdf(f) {
    return f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  }

  /* ---------- 병합 ---------- */
  async function addMergeFiles(list) {
    clearErr();
    const arr = Array.from(list);
    const bad = [];

    for (let i = 0; i < arr.length; i++) {
      const f = arr[i];
      if (!isPdf(f)) { bad.push(f.name + ' (PDF가 아님)'); continue; }
      try {
        const info = await readPdf(f);
        files.push({ name: f.name, size: f.size, bytes: info.bytes, pages: info.pages });
      } catch (e) {
        bad.push(f.name + ' (' + (e && e.message ? e.message.slice(0, 60) : '읽기 실패') + ')');
      }
    }

    renderList();
    if (bad.length) showErr('다음 파일은 추가하지 못했습니다 : ' + bad.join(' · '));
  }

  function renderList() {
    fileList.innerHTML = '';

    files.forEach(function (f, i) {
      const row = document.createElement('div');
      row.className = 'row';
      row.draggable = true;
      row.dataset.i = i;

      const grip = document.createElement('span');
      grip.className = 'grip';
      grip.textContent = '⠿';
      grip.title = '끌어서 순서 변경';

      const idx = document.createElement('span');
      idx.className = 'meta';
      idx.style.flex = 'none';
      idx.textContent = String(i + 1).padStart(2, '0');

      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.style.flex = '1';
      nm.textContent = f.name;
      nm.title = f.name;

      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.style.flex = 'none';
      meta.textContent = f.pages + '쪽 · ' + fmtSize(f.size);

      const up = document.createElement('button');
      up.className = 'iconBtn';
      up.textContent = '↑';
      up.disabled = i === 0;
      up.title = '위로';
      up.addEventListener('click', function () { move(i, i - 1); });

      const down = document.createElement('button');
      down.className = 'iconBtn';
      down.textContent = '↓';
      down.disabled = i === files.length - 1;
      down.title = '아래로';
      down.addEventListener('click', function () { move(i, i + 1); });

      const del = document.createElement('button');
      del.className = 'iconBtn del';
      del.textContent = '×';
      del.title = '제거';
      del.addEventListener('click', function () { files.splice(i, 1); renderList(); });

      [grip, idx, nm, meta, up, down, del].forEach(function (el) { row.appendChild(el); });
      fileList.appendChild(row);
    });

    listWrap.classList.toggle('hidden', files.length === 0);
    fileCount.textContent = files.length;
    pageTotal.textContent = files.reduce(function (s, f) { return s + f.pages; }, 0);
  }

  function move(from, to) {
    if (to < 0 || to >= files.length) return;
    const item = files.splice(from, 1)[0];
    files.splice(to, 0, item);
    renderList();
  }

  // 행 끌어서 순서 변경
  let dragIdx = null;
  fileList.addEventListener('dragstart', function (ev) {
    const row = ev.target.closest('.row');
    if (!row) return;
    dragIdx = parseInt(row.dataset.i, 10);
    row.classList.add('dragging');
    ev.dataTransfer.effectAllowed = 'move';
    try { ev.dataTransfer.setData('text/plain', String(dragIdx)); } catch (e) {}
  });
  fileList.addEventListener('dragover', function (ev) {
    ev.preventDefault();
    const row = ev.target.closest('.row');
    document.querySelectorAll('.row').forEach(function (r) { r.classList.remove('dropTarget'); });
    if (row) row.classList.add('dropTarget');
  });
  fileList.addEventListener('drop', function (ev) {
    ev.preventDefault();
    const row = ev.target.closest('.row');
    document.querySelectorAll('.row').forEach(function (r) { r.classList.remove('dropTarget', 'dragging'); });
    if (!row || dragIdx === null) return;
    const to = parseInt(row.dataset.i, 10);
    if (to !== dragIdx) move(dragIdx, to);
    dragIdx = null;
  });
  fileList.addEventListener('dragend', function () {
    document.querySelectorAll('.row').forEach(function (r) { r.classList.remove('dropTarget', 'dragging'); });
    dragIdx = null;
  });

  document.getElementById('mergeBtn').addEventListener('click', async function () {
    if (!PDFLib) return;
    if (files.length < 1) { toast('합칠 파일을 넣어 주세요'); return; }
    if (files.length === 1 && !confirm('파일이 하나뿐입니다. 그대로 저장할까요?')) return;

    const btn = this;
    btn.disabled = true;
    btn.textContent = '병합 중…';
    clearErr();

    try {
      const out = await PDFLib.PDFDocument.create();
      for (let i = 0; i < files.length; i++) {
        const src = await PDFLib.PDFDocument.load(files[i].bytes, { ignoreEncryption: true });
        const pages = await out.copyPages(src, src.getPageIndices());
        pages.forEach(function (p) { out.addPage(p); });
      }
      const bytes = await out.save();
      download(bytes, 'merged_' + stamp() + '.pdf');
      toast(files.length + '개 파일을 합쳐 저장했습니다');
    } catch (e) {
      showErr('병합에 실패했습니다 : ' + (e && e.message ? e.message : '알 수 없는 오류'));
    } finally {
      btn.disabled = false;
      btn.textContent = '병합 및 다운로드';
    }
  });

  document.getElementById('clearMerge').addEventListener('click', function () {
    if (!files.length || confirm('추가한 파일을 모두 비웁니다. 계속할까요?')) {
      files = [];
      renderList();
      clearErr();
    }
  });

  bindDrop(document.getElementById('dropMerge'), document.getElementById('pickMerge'), addMergeFiles);

  /* ---------- 추출 ---------- */
  async function setSplitFile(list) {
    clearErr();
    const f = Array.from(list)[0];
    if (!f) return;
    if (!isPdf(f)) { showErr('PDF 파일만 넣을 수 있습니다.'); return; }

    try {
      const info = await readPdf(f);
      splitDoc = { name: f.name, bytes: info.bytes, pages: info.pages };
      splitName.textContent = f.name;
      splitMeta.textContent = info.pages + '쪽 · ' + fmtSize(f.size);
      splitPanel.classList.remove('hidden');
      if (!rangesEl.value.trim()) rangesEl.value = '1-' + Math.min(info.pages, 3);
      updateRangeInfo();
      rangesEl.focus();
    } catch (e) {
      showErr('PDF를 읽지 못했습니다 : ' + (e && e.message ? e.message : '알 수 없는 오류'));
    }
  }

  bindDrop(document.getElementById('dropSplit'), document.getElementById('pickSplit'), setSplitFile);

  // "1-3, 5, 7-10" 형태를 페이지 번호 목록으로. 5- 는 끝까지, -3 은 처음부터
  function parseRanges(input, max) {
    const groups = [], bad = [], over = [];

    String(input).split(/[,\n;]/).forEach(function (tok) {
      const t = tok.trim();
      if (!t) return;
      let m;
      if ((m = t.match(/^(\d+)\s*[-~–]\s*(\d+)$/))) {
        let a = parseInt(m[1], 10), b = parseInt(m[2], 10);
        if (a > b) { const s = a; a = b; b = s; }
        groups.push({ from: a, to: b, label: t });
      } else if ((m = t.match(/^(\d+)\s*[-~–]$/))) {
        groups.push({ from: parseInt(m[1], 10), to: max, label: t });
      } else if ((m = t.match(/^[-~–]\s*(\d+)$/))) {
        groups.push({ from: 1, to: parseInt(m[1], 10), label: t });
      } else if (/^\d+$/.test(t)) {
        const n = parseInt(t, 10);
        groups.push({ from: n, to: n, label: t });
      } else if (/^(전체|all)$/i.test(t)) {
        groups.push({ from: 1, to: max, label: t });
      } else {
        bad.push(t);
      }
    });

    const clean = [], flat = [];
    groups.forEach(function (g) {
      if (g.from < 1 || g.to > max || g.from > max) over.push(g.label);
      const from = Math.max(1, g.from), to = Math.min(max, g.to);
      if (from > to) return;
      const pages = [];
      for (let i = from; i <= to; i++) { pages.push(i); flat.push(i); }
      clean.push({ label: g.label, pages: pages });
    });

    return { groups: clean, pages: flat, bad: bad, over: over };
  }

  function updateRangeInfo() {
    if (!splitDoc) { rangeInfo.textContent = ''; return; }
    const r = parseRanges(rangesEl.value, splitDoc.pages);
    const msgs = [];

    if (r.pages.length) msgs.push('총 ' + r.pages.length + '쪽 추출');
    else msgs.push('추출할 페이지가 없습니다');
    if (r.bad.length) msgs.push('인식 못한 표기 : ' + r.bad.join(', '));
    if (r.over.length) msgs.push('범위를 벗어난 값 : ' + r.over.join(', ') + ' (이 문서는 ' + splitDoc.pages + '쪽)');

    rangeInfo.textContent = msgs.join(' · ');
    rangeInfo.style.color = (r.bad.length || r.over.length || !r.pages.length) ? 'var(--alert)' : 'var(--muted)';
  }

  rangesEl.addEventListener('input', updateRangeInfo);
  splitEach.addEventListener('change', updateRangeInfo);

  document.querySelectorAll('[data-quick]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!splitDoc) return;
      const n = splitDoc.pages;
      const k = b.dataset.quick;
      if (k === 'all') rangesEl.value = '1-' + n;
      else if (k === 'half1') rangesEl.value = '1-' + Math.ceil(n / 2);
      else if (k === 'half2') rangesEl.value = (Math.ceil(n / 2) + 1) + '-' + n;
      else {
        const arr = [];
        for (let i = (k === 'odd' ? 1 : 2); i <= n; i += 2) arr.push(i);
        rangesEl.value = arr.join(', ');
      }
      updateRangeInfo();
    });
  });

  document.getElementById('splitBtn').addEventListener('click', async function () {
    if (!PDFLib || !splitDoc) { toast('먼저 PDF를 넣어 주세요'); return; }

    const r = parseRanges(rangesEl.value, splitDoc.pages);
    if (!r.pages.length) { toast('추출할 페이지를 입력해 주세요'); return; }

    const btn = this;
    btn.disabled = true;
    btn.textContent = '추출 중…';
    clearErr();

    try {
      const src = await PDFLib.PDFDocument.load(splitDoc.bytes, { ignoreEncryption: true });
      const base = splitDoc.name.replace(/\.pdf$/i, '');

      if (splitEach.checked && r.groups.length > 1) {
        // 범위마다 별도 파일로
        for (let g = 0; g < r.groups.length; g++) {
          const grp = r.groups[g];
          const out = await PDFLib.PDFDocument.create();
          const copied = await out.copyPages(src, grp.pages.map(function (p) { return p - 1; }));
          copied.forEach(function (p) { out.addPage(p); });
          const bytes = await out.save();
          download(bytes, base + '_' + grp.label.replace(/\s/g, '') + '.pdf');
        }
        toast(r.groups.length + '개 파일로 나눠 저장했습니다');
      } else {
        const out = await PDFLib.PDFDocument.create();
        const copied = await out.copyPages(src, r.pages.map(function (p) { return p - 1; }));
        copied.forEach(function (p) { out.addPage(p); });
        const bytes = await out.save();
        download(bytes, base + '_extract_' + stamp() + '.pdf');
        toast(r.pages.length + '쪽을 추출해 저장했습니다');
      }
    } catch (e) {
      showErr('추출에 실패했습니다 : ' + (e && e.message ? e.message : '알 수 없는 오류'));
    } finally {
      btn.disabled = false;
      btn.textContent = '추출 및 다운로드';
    }
  });

  document.getElementById('clearSplit').addEventListener('click', function () {
    splitDoc = null;
    splitPanel.classList.add('hidden');
    rangesEl.value = '';
    rangeInfo.textContent = '';
    clearErr();
  });
})();
</script>
</body>
</html>
