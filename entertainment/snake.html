<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>스네이크</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root{
    --bg:#0D1117; --panel:#161C24; --line:#232C38;
    --fg:#E8EDF3; --dim:#8A97A6; --accent:#2C6BA0;
    --snake:#4ADE80; --head:#86EFAC; --apple:#EF4444;
    --gold:#FACC15; --shrink:#A855F7; --btn:#1C242E; --btnA:#28323E;
  }
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    overscroll-behavior:none; touch-action:none;
    background:var(--bg); color:var(--fg);
    font-family:'Pretendard',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
  }
  .num{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  #app{
    display:flex; flex-direction:column; height:100dvh; max-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  #hud{ flex:none; display:flex; gap:8px; padding:10px 12px 6px; align-items:stretch; }
  .box{
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:6px 10px; display:flex; flex-direction:column; justify-content:center;
  }
  .box .k{ font-size:9px; color:var(--dim); letter-spacing:.05em; }
  .box .v{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; line-height:1.15; }
  .iconBtn{
    width:38px; border-radius:9px; flex:none;
    background:var(--panel); border:1px solid var(--line); color:var(--fg);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .iconBtn:active{ background:var(--btnA); transform:scale(.95); }

  #stage{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:2px 12px; }
  #cv{ display:block; border-radius:10px; background:#0A0E14; border:1px solid var(--line); touch-action:none; }

  #pad{ flex:none; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); }
  .btn{
    background:var(--btn); border:1px solid var(--line); border-radius:14px;
    color:var(--fg); display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:pointer; transition:background .08s, transform .06s;
  }
  .btn:active, .btn.on{ background:var(--btnA); transform:scale(.95); }
  #swipeHint{ text-align:center; font-size:12px; color:var(--dim); padding:16px 0 20px; }

  .modal{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(6,10,16,.78); backdrop-filter:blur(6px);
  }
  .modal.show{ display:flex; }
  .card{
    width:100%; max-width:330px; max-height:86dvh; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;
  }
  .seg{ display:flex; gap:6px; }
  .seg button{
    flex:1; padding:9px 6px; border-radius:8px;
    border:1px solid var(--line); background:transparent; color:var(--dim);
    font-size:12.5px; cursor:pointer;
  }
  .seg button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; }
  .lab{ font-size:13px; }
  .sub{ font-size:10.5px; color:var(--dim); margin-top:2px; line-height:1.5; }
  .switch{ position:relative; width:44px; height:24px; flex:none; }
  .switch input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .track{ position:absolute; inset:0; border-radius:999px; background:#2A3340; transition:background .16s; pointer-events:none; }
  .knob{ position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:999px; background:#fff; transition:transform .16s; pointer-events:none; }
  .switch input:checked ~ .track{ background:var(--accent); }
  .switch input:checked ~ .knob{ transform:translateX(20px); }
  .primary{ width:100%; padding:12px; border-radius:10px; border:0; background:var(--accent); color:#fff;
            font-size:14px; font-weight:600; cursor:pointer; }
  .ghost{ width:100%; padding:11px; border-radius:10px; border:1px solid var(--line);
          background:transparent; color:var(--fg); font-size:13px; cursor:pointer; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<body>

<div id="app">

  <div id="hud">
    <div class="box" style="flex:1">
      <span class="k">SCORE</span><span class="v" id="score">0</span>
    </div>
    <div class="box" style="flex:1">
      <span class="k">BEST</span><span class="v" id="best">0</span>
    </div>
    <div class="box" style="flex:none; min-width:56px; align-items:center">
      <span class="k">LENGTH</span><span class="v" id="len" style="font-size:15px">3</span>
    </div>
    <button class="iconBtn" id="pauseBtn" aria-label="일시정지">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </button>
    <button class="iconBtn" id="menuBtn" aria-label="설정">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line>
      </svg>
    </button>
  </div>

  <div id="stage"><canvas id="cv"></canvas></div>

  <div id="pad">
    <!-- 십자키 -->
    <div id="dpad" style="display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:8px; max-width:300px; margin:0 auto">
      <div></div>
      <button class="btn" data-dir="up" style="height:58px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 15 12 8 19 15"></polyline></svg>
      </button>
      <div></div>
      <button class="btn" data-dir="left" style="height:58px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"></polyline></svg>
      </button>
      <button class="btn" data-dir="down" style="height:58px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 12 16 19 9"></polyline></svg>
      </button>
      <button class="btn" data-dir="right" style="height:58px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"></polyline></svg>
      </button>
    </div>
    <div id="swipeHint" style="display:none">화면을 손가락으로 밀어 방향을 바꿉니다</div>
  </div>
</div>

<!-- 설정 -->
<div class="modal" id="menu">
  <div class="card">
    <p style="margin:0 0 14px; font-size:16px; font-weight:600">설정</p>

    <p class="lab" style="margin:0 0 7px">이동 속도</p>
    <div class="seg" id="spdSeg" style="margin-bottom:14px">
      <button data-spd="slow">느림</button>
      <button data-spd="normal" class="on">보통</button>
      <button data-spd="fast">빠름</button>
    </div>

    <p class="lab" style="margin:0 0 7px">조작 방식</p>
    <div class="seg" id="ctlSeg" style="margin-bottom:6px">
      <button data-ctl="dpad" class="on">십자키</button>
      <button data-ctl="swipe">스와이프</button>
    </div>
    <p class="sub" style="margin-bottom:12px">스와이프를 고르면 화면 어디서나 밀어서 조작합니다</p>

    <div class="row" style="border-top:1px solid var(--line)">
      <div>
        <div class="lab">벽 통과</div>
        <div class="sub">끄면 벽에 닿을 때 게임 종료</div>
      </div>
      <span class="switch"><input type="checkbox" id="optWrap"><span class="track"></span><span class="knob"></span></span>
    </div>

    <div class="row" style="border-top:1px solid var(--line)">
      <div>
        <div class="lab">특수 아이템</div>
        <div class="sub">황금 사과 · 길이 감소 아이템 출현</div>
      </div>
      <span class="switch"><input type="checkbox" id="optItem" checked><span class="track"></span><span class="knob"></span></span>
    </div>

    <div class="row" style="border-top:1px solid var(--line)">
      <span class="lab">효과음</span>
      <span class="switch"><input type="checkbox" id="optSound" checked><span class="track"></span><span class="knob"></span></span>
    </div>

    <div class="row" style="border-top:1px solid var(--line); border-bottom:1px solid var(--line)">
      <span class="lab">진동</span>
      <span class="switch"><input type="checkbox" id="optVib" checked><span class="track"></span><span class="knob"></span></span>
    </div>

    <div style="display:grid; gap:8px; margin-top:16px">
      <button class="primary" id="newGame">새 게임 시작</button>
      <button class="ghost" id="closeMenu">돌아가기</button>
      <button class="ghost" id="resetBest" style="color:var(--dim)">최고 점수 지우기</button>
    </div>

    <p class="sub" style="margin-top:14px">키보드 · 방향키 또는 WASD · Space 일시정지</p>
  </div>
</div>

<!-- 결과 -->
<div class="modal" id="over">
  <div class="card" style="text-align:center">
    <p id="overTitle" style="margin:0 0 6px; font-size:19px; font-weight:700">스네이크</p>
    <p id="overDesc" style="margin:0 0 16px; font-size:13px; color:var(--dim); line-height:1.7">사과를 먹고 길어지세요</p>
    <div style="display:grid; gap:8px">
      <button class="primary" id="againBtn">게임 시작</button>
      <button class="ghost" id="overMenu">설정 열기</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const SPEED = { slow: 220, normal: 150, fast: 95 };
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  let COLS = 17, ROWS = 22, cell = 16;
  let snake, dir, queue, food, items, score, best = 0, alive = false, paused = false;
  let acc = 0, lastTs = 0, growth = 0, tickMs = 150, blink = 0;

  let speed = 'normal', control = 'dpad', wrap = false, useItems = true, sound = true, vib = true;

  /* ---------- 저장 ---------- */
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem('snake-v1') || '{}');
      best = d.best || 0;
      speed = d.speed || 'normal';
      control = d.control || 'dpad';
      wrap = !!d.wrap;
      useItems = d.items !== false;
      sound = d.sound !== false;
      vib = d.vib !== false;
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem('snake-v1', JSON.stringify({
        best: best, speed: speed, control: control, wrap: wrap,
        items: useItems, sound: sound, vib: vib
      }));
    } catch (e) {}
  }

  /* ---------- 소리 · 진동 ---------- */
  let actx = null;
  function beep(freq, dur, type, gain) {
    if (!sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = gain || 0.05;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.07));
      o.stop(actx.currentTime + (dur || 0.07));
    } catch (e) {}
  }
  function buzz(p) { if (vib) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} } }

  /* ---------- 화면 맞추기 ---------- */
  function fit() {
    const stage = document.getElementById('stage');
    const rect = stage.getBoundingClientRect();
    const availW = rect.width - 4, availH = rect.height - 4;

    // 칸 크기를 먼저 정하고, 남는 공간에 맞춰 칸 수를 잡는다
    cell = Math.max(12, Math.min(26, Math.floor(availW / 17)));
    COLS = Math.max(10, Math.floor(availW / cell));
    ROWS = Math.max(10, Math.floor(availH / cell));

    cv.width = COLS * cell;
    cv.height = ROWS * cell;
    cv.style.width = cv.width + 'px';
    cv.style.height = cv.height + 'px';

    // 칸 수가 줄어 뱀이나 먹이가 밖으로 나갔다면 안으로 당긴다
    if (snake) {
      snake.forEach(function (s) {
        s.x = Math.min(s.x, COLS - 1); s.y = Math.min(s.y, ROWS - 1);
      });
      if (food) { food.x = Math.min(food.x, COLS - 1); food.y = Math.min(food.y, ROWS - 1); }
      items = (items || []).filter(function (it) { return it.x < COLS && it.y < ROWS; });
    }
    draw();
  }

  /* ---------- 게임 ---------- */
  function freeCell() {
    const taken = {};
    snake.forEach(function (s) { taken[s.x + ',' + s.y] = 1; });
    if (food) taken[food.x + ',' + food.y] = 1;
    items.forEach(function (i) { taken[i.x + ',' + i.y] = 1; });

    const open = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!taken[x + ',' + y]) open.push({ x: x, y: y });
    }
    if (!open.length) return null;
    return open[Math.floor(Math.random() * open.length)];
  }

  function placeFood() { food = freeCell(); }

  function maybeItem() {
    if (!useItems || items.length >= 2) return;
    if (Math.random() > 0.22) return;
    const c = freeCell();
    if (!c) return;
    // 황금 사과는 점수가 크고, 보라 아이템은 길이를 줄인다
    const gold = Math.random() < 0.6;
    items.push({ x: c.x, y: c.y, kind: gold ? 'gold' : 'shrink', life: gold ? 9000 : 8000 });
  }

  function newGame() {
    document.getElementById('menu').classList.remove('show');
    document.getElementById('over').classList.remove('show');
    fit();

    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = { x: 1, y: 0 };
    queue = [];
    items = [];
    score = 0; growth = 0;
    tickMs = SPEED[speed];
    alive = true; paused = false;
    acc = 0; lastTs = 0;
    placeFood();
    updateHud();
    draw();
  }

  function turn(nx, ny) {
    if (!alive || paused) return;
    // 마지막으로 예약된 방향을 기준으로 판단해야 빠른 연속 입력이 씹히지 않는다
    const base = queue.length ? queue[queue.length - 1] : dir;
    if (base.x === -nx && base.y === -ny) return;   // 반대 방향으로는 못 돈다
    if (base.x === nx && base.y === ny) return;
    if (queue.length < 2) { queue.push({ x: nx, y: ny }); beep(300, .03, 'square', .025); }
  }

  function step() {
    if (queue.length) dir = queue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (wrap) {
      head.x = (head.x + COLS) % COLS;
      head.y = (head.y + ROWS) % ROWS;
    } else if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return die('벽에 부딪혔습니다');
    }

    // 꼬리 끝은 이번에 비워지므로 충돌로 보지 않는다
    for (let i = 0; i < snake.length - (growth > 0 ? 0 : 1); i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return die('자기 몸에 부딪혔습니다');
    }

    snake.unshift(head);

    let ate = false;
    if (food && head.x === food.x && head.y === food.y) {
      score += 10; growth += 1; ate = true;
      beep(660, .06, 'square', .05); buzz(12);
      placeFood(); maybeItem();
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (head.x === it.x && head.y === it.y) {
        if (it.kind === 'gold') {
          score += 50; growth += 2;
          beep(880, .12, 'triangle', .06); buzz([10, 30, 10]);
        } else {
          score += 20;
          const cut = Math.min(3, snake.length - 3);
          if (cut > 0) snake.splice(snake.length - cut, cut);
          beep(420, .12, 'sine', .06); buzz(20);
        }
        items.splice(i, 1);
        ate = true;
      }
    }

    if (growth > 0) growth--;
    else if (!ate) snake.pop();

    if (score > best) { best = score; save(); }
    updateHud();
  }

  function die(reason) {
    alive = false;
    beep(140, .3, 'sawtooth', .06);
    buzz([40, 60, 90]);
    if (score > best) { best = score; save(); }
    document.getElementById('overTitle').textContent = '게임 종료';
    document.getElementById('overDesc').textContent =
      reason + '\n점수 ' + score.toLocaleString('ko-KR') + ' · 길이 ' + snake.length +
      (score >= best && score > 0 ? '\n최고 기록!' : '');
    document.getElementById('againBtn').textContent = '다시 하기';
    document.getElementById('over').classList.add('show');
    updateHud();
  }

  function updateHud() {
    document.getElementById('score').textContent = score.toLocaleString('ko-KR');
    document.getElementById('best').textContent = best.toLocaleString('ko-KR');
    document.getElementById('len').textContent = snake ? snake.length : 3;
  }

  /* ---------- 그리기 ---------- */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  function draw() {
    const w = cv.width, h = cv.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0A0E14';
    ctx.fillRect(0, 0, w, h);

    // 격자
    ctx.strokeStyle = 'rgba(255,255,255,.035)';
    ctx.lineWidth = 1;
    for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, h); ctx.stroke(); }
    for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell + .5); ctx.lineTo(w, y * cell + .5); ctx.stroke(); }

    // 사과
    if (food) {
      ctx.fillStyle = '#EF4444';
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }

    // 특수 아이템 (사라질 때가 되면 깜빡인다)
    items.forEach(function (it) {
      if (it.life < 2000 && Math.floor(blink / 160) % 2 === 0) return;
      ctx.fillStyle = it.kind === 'gold' ? '#FACC15' : '#A855F7';
      const cx = it.x * cell + cell / 2, cy = it.y * cell + cell / 2, r = cell * 0.34;
      ctx.beginPath();
      if (it.kind === 'gold') {
        for (let i = 0; i < 5; i++) {
          const a1 = -Math.PI / 2 + i * Math.PI * 2 / 5;
          const a2 = a1 + Math.PI / 5;
          ctx.lineTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
          ctx.lineTo(cx + Math.cos(a2) * r * 0.45, cy + Math.sin(a2) * r * 0.45);
        }
        ctx.closePath();
      } else {
        roundRect(cx - r, cy - r * 0.35, r * 2, r * 0.7, 2);
      }
      ctx.fill();
    });

    // 뱀
    if (snake) {
      for (let i = snake.length - 1; i >= 0; i--) {
        const s = snake[i];
        const t = 1 - (i / Math.max(1, snake.length)) * 0.45;
        ctx.fillStyle = i === 0 ? '#86EFAC' : '#4ADE80';
        ctx.globalAlpha = i === 0 ? 1 : t;
        const pad = i === 0 ? 1 : 2;
        roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, Math.max(2, cell * 0.28));
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 눈
      const hd = snake[0];
      ctx.fillStyle = '#0A0E14';
      const ex = hd.x * cell + cell / 2 + dir.x * cell * 0.16;
      const ey = hd.y * cell + cell / 2 + dir.y * cell * 0.16;
      const off = cell * 0.15;
      const px = dir.x !== 0 ? 0 : off, py = dir.x !== 0 ? off : 0;
      ctx.beginPath(); ctx.arc(ex + px, ey + py, Math.max(1, cell * 0.09), 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex - px, ey - py, Math.max(1, cell * 0.09), 0, Math.PI * 2); ctx.fill();
    }

    if (paused && alive) {
      ctx.fillStyle = 'rgba(6,10,16,.78)';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#E8EDF3';
      ctx.font = '600 ' + Math.round(cell * 1.1) + 'px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('일시정지', w / 2, h / 2);
    }
  }

  /* ---------- 루프 ---------- */
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!lastTs) lastTs = ts;
    const dt = Math.min(200, ts - lastTs);
    lastTs = ts;
    blink += dt;

    if (!alive || paused) { draw(); return; }

    // 아이템 수명
    for (let i = items.length - 1; i >= 0; i--) {
      items[i].life -= dt;
      if (items[i].life <= 0) items.splice(i, 1);
    }

    acc += dt;
    while (acc >= tickMs) {
      acc -= tickMs;
      step();
      if (!alive) break;
    }
    draw();
  }

  /* ---------- 조작 ---------- */
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  document.querySelectorAll('[data-dir]').forEach(function (b) {
    b.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      const d = DIRS[b.dataset.dir];
      turn(d[0], d[1]);
    });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  // 스와이프 : 가로세로 중 더 많이 움직인 쪽으로 판정한다
  let sx = 0, sy = 0, swiping = false;
  const stage = document.getElementById('stage');
  stage.addEventListener('pointerdown', function (ev) {
    if (control !== 'swipe') return;
    swiping = true; sx = ev.clientX; sy = ev.clientY;
  });
  stage.addEventListener('pointermove', function (ev) {
    if (!swiping || control !== 'swipe') return;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    const th = 24;
    if (Math.abs(dx) < th && Math.abs(dy) < th) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    sx = ev.clientX; sy = ev.clientY;   // 이어서 밀면 계속 방향 전환
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) {
    stage.addEventListener(t, function () { swiping = false; });
  });

  document.addEventListener('keydown', function (ev) {
    if (document.querySelector('.modal.show')) return;
    const k = ev.key.toLowerCase();
    const map = { arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right',
                  w: 'up', s: 'down', a: 'left', d: 'right' };
    if (map[k]) { ev.preventDefault(); const d = DIRS[map[k]]; turn(d[0], d[1]); return; }
    if (k === ' ' || k === 'p') { ev.preventDefault(); togglePause(); }
  }, { passive: false });

  function togglePause() {
    if (!alive) return;
    paused = !paused;
    lastTs = 0;
    draw();
  }
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && alive) { paused = true; draw(); }
  });

  /* ---------- 설정 ---------- */
  function applyControl() {
    const dpad = document.getElementById('dpad');
    const hint = document.getElementById('swipeHint');
    const swipe = control === 'swipe';
    dpad.style.display = swipe ? 'none' : 'grid';
    hint.style.display = swipe ? 'block' : 'none';
    setTimeout(fit, 30);
  }

  const menu = document.getElementById('menu');
  document.getElementById('menuBtn').addEventListener('click', function () {
    if (alive) paused = true;
    menu.classList.add('show'); draw();
  });
  document.getElementById('closeMenu').addEventListener('click', function () {
    menu.classList.remove('show');
    if (alive) { paused = false; lastTs = 0; }
    draw();
  });
  document.getElementById('newGame').addEventListener('click', newGame);
  document.getElementById('againBtn').addEventListener('click', newGame);
  document.getElementById('overMenu').addEventListener('click', function () {
    document.getElementById('over').classList.remove('show');
    menu.classList.add('show');
  });
  document.getElementById('resetBest').addEventListener('click', function () {
    best = 0; save(); updateHud();
  });

  document.querySelectorAll('#spdSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      speed = b.dataset.spd;
      tickMs = SPEED[speed];
      document.querySelectorAll('#spdSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      save();
    });
  });
  document.querySelectorAll('#ctlSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      control = b.dataset.ctl;
      document.querySelectorAll('#ctlSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      applyControl(); save();
    });
  });

  const oWrap = document.getElementById('optWrap');
  const oItem = document.getElementById('optItem');
  const oSound = document.getElementById('optSound');
  const oVib = document.getElementById('optVib');
  oWrap.addEventListener('change', function () { wrap = oWrap.checked; save(); });
  oItem.addEventListener('change', function () { useItems = oItem.checked; if (!useItems) items = []; save(); });
  oSound.addEventListener('change', function () { sound = oSound.checked; save(); if (sound) beep(520, .05); });
  oVib.addEventListener('change', function () { vib = oVib.checked; save(); if (vib) buzz(30); });

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);

  /* ---------- 시작 ---------- */
  load();
  document.querySelectorAll('#spdSeg button').forEach(function (b) { b.classList.toggle('on', b.dataset.spd === speed); });
  document.querySelectorAll('#ctlSeg button').forEach(function (b) { b.classList.toggle('on', b.dataset.ctl === control); });
  oWrap.checked = wrap; oItem.checked = useItems; oSound.checked = sound; oVib.checked = vib;
  applyControl();

  snake = null; items = []; score = 0; alive = false;
  updateHud();
  fit();
  requestAnimationFrame(loop);
  document.getElementById('over').classList.add('show');
})();
</script>
</body>
</html>
