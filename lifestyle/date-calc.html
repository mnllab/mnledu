<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>만능 날짜 계산기</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>

<style>
  :root{
    --bg:#F4F5F7; --panel:#FFFFFF; --line:#E3E7EC; --ink:#26384B; --dim:#5F7488;
    --accent:#2C6BA0; --soft:#EAF1F7; --ok:#2E7D5B; --warn:#A34A3C;
  }
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:13px; }

  .tab{
    flex:1; padding:11px 6px; border-radius:9px; border:1px solid var(--line);
    background:#fff; color:var(--dim); font-size:13px; cursor:pointer; transition:all .12s;
  }
  .tab.on{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .fld{
    width:100%; border:1px solid var(--line); border-radius:9px; background:#fff;
    padding:11px 12px; font-size:15px; color:var(--ink); outline:none;
    font-family:'JetBrains Mono',monospace;
  }
  .fld:focus{ border-color:var(--accent); }
  .lab{ display:block; font-size:11.5px; color:var(--dim); margin-bottom:5px; }

  .opt{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-size:13px; }
  .opt input{ accent-color:var(--accent); width:16px; height:16px; }

  .result{
    background:linear-gradient(160deg, #26384B, #1B2836); color:#fff;
    border-radius:13px; padding:20px 18px;
  }
  .result .big{ font-family:'JetBrains Mono',monospace; font-size:30px; font-weight:700; line-height:1.15; letter-spacing:-.01em; }
  .result .cap{ font-size:11.5px; opacity:.66; letter-spacing:.05em; }
  .stat{
    background:rgba(255,255,255,.09); border-radius:9px; padding:10px 12px;
  }
  .stat .k{ font-size:10.5px; opacity:.66; }
  .stat .v{ font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; margin-top:2px; }

  .btn{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:8px; font-size:12.5px; padding:8px 12px; cursor:pointer;
  }
  .btn:active{ background:var(--soft); }
  .btn.p{ background:var(--ink); border-color:var(--ink); color:#fff; }

  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,10px); opacity:0;
    background:var(--ink); color:#fff; border-radius:9px;
    padding:10px 16px; font-size:13px; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<body>
<div class="mx-auto max-w-2xl px-4 py-6 sm:py-9">

  <header class="mb-5">
    <h1 class="text-[18px] font-semibold tracking-tight">만능 날짜 계산기</h1>
    <p class="mt-1 text-[12.5px]" style="color:var(--dim)">더하고 빼고 세는 날짜 계산을 한곳에서</p>
  </header>

  <div style="display:flex; gap:7px; margin-bottom:16px">
    <button class="tab on" data-tab="add">날짜 + 며칠</button>
    <button class="tab" data-tab="diff">두 날짜 차이</button>
    <button class="tab" data-tab="age">나이 · 연차</button>
  </div>

  <!-- 1. 날짜 + 며칠 -->
  <section id="tab-add">
    <div class="panel" style="padding:16px">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
        <div>
          <label class="lab" for="aBase">기준일</label>
          <input class="fld" id="aBase" type="date">
        </div>
        <div>
          <label class="lab" for="aDays">일수 (음수면 이전)</label>
          <input class="fld" id="aDays" type="number" inputmode="numeric" value="100">
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:14px; margin-top:13px">
        <label class="opt"><input type="checkbox" id="aBiz">주말 제외하고 영업일만</label>
        <label class="opt"><input type="checkbox" id="aInc">기준일 포함(초일 산입)</label>
      </div>
      <div style="display:flex; gap:7px; margin-top:12px; flex-wrap:wrap">
        <button class="btn" data-quick="7">+7일</button>
        <button class="btn" data-quick="30">+30일</button>
        <button class="btn" data-quick="100">+100일</button>
        <button class="btn" data-quick="365">+365일</button>
        <button class="btn" data-quick="-1">-1일</button>
      </div>
    </div>
    <div class="result mt-3" id="addRes"></div>
  </section>

  <!-- 2. 두 날짜 차이 -->
  <section id="tab-diff" style="display:none">
    <div class="panel" style="padding:16px">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
        <div>
          <label class="lab" for="dFrom">시작일</label>
          <input class="fld" id="dFrom" type="date">
        </div>
        <div>
          <label class="lab" for="dTo">종료일</label>
          <input class="fld" id="dTo" type="date">
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:14px; margin-top:13px">
        <label class="opt"><input type="checkbox" id="dInc" checked>시작일 산입 (한국식 D-Day)</label>
      </div>
    </div>
    <div class="result mt-3" id="diffRes"></div>
  </section>

  <!-- 3. 나이 · 연차 -->
  <section id="tab-age" style="display:none">
    <div class="panel" style="padding:16px">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
        <div>
          <label class="lab" for="gBirth">생년월일 또는 입사일</label>
          <input class="fld" id="gBirth" type="date">
        </div>
        <div>
          <label class="lab" for="gBase">기준일</label>
          <input class="fld" id="gBase" type="date">
        </div>
      </div>
      <p class="mt-3 text-[11.5px]" style="color:var(--dim)">
        만나이는 생일이 지났는지까지 따져 계산합니다. 근속은 같은 기준으로 년·월·일을 나눠 보여줍니다.
      </p>
    </div>
    <div class="result mt-3" id="ageRes"></div>
  </section>

  <div style="display:flex; gap:7px; margin-top:14px">
    <button class="btn p" id="copyBtn" style="flex:1; padding:11px">결과 복사</button>
    <button class="btn" id="todayBtn" style="flex:1; padding:11px">오늘로 되돌리기</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  let tab = 'add';

  const toastEl = document.getElementById('toast');
  let tt = null;
  function toast(m) {
    toastEl.textContent = m; toastEl.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  function D(v) { return window.dayjs ? dayjs(v) : null; }
  function todayStr() { return D(new Date()).format('YYYY-MM-DD'); }
  function label(d) { return d.format('YYYY년 M월 D일') + ' (' + DOW[d.day()] + ')'; }
  function iso(d) { return d.format('YYYY-MM-DD'); }
  function n(v) { return v.toLocaleString('ko-KR'); }

  /* ---------- 1. 날짜 + 며칠 ---------- */
  // 영업일 계산은 주말을 건너뛰며 하루씩 세는 방식이라야 정확하다
  function addBusiness(start, days) {
    let d = start, left = Math.abs(days), step = days >= 0 ? 1 : -1;
    while (left > 0) {
      d = d.add(step, 'day');
      const w = d.day();
      if (w !== 0 && w !== 6) left--;
    }
    return d;
  }

  function calcAdd() {
    const base = D(document.getElementById('aBase').value);
    const raw = parseInt(document.getElementById('aDays').value, 10);
    const box = document.getElementById('addRes');

    if (!base || !base.isValid() || isNaN(raw)) {
      box.innerHTML = '<p class="cap">기준일과 일수를 입력해 주세요</p>';
      return '';
    }

    const biz = document.getElementById('aBiz').checked;
    const inc = document.getElementById('aInc').checked;
    // 초일 산입이면 기준일이 1일째이므로 하루 덜 더한다
    const days = inc ? (raw > 0 ? raw - 1 : raw + 1) : raw;
    const target = biz ? addBusiness(base, days) : base.add(days, 'day');

    const gap = target.diff(base, 'day');
    box.innerHTML =
      '<p class="cap">' + label(base) + ' 로부터 ' + (raw >= 0 ? raw + '일 뒤' : Math.abs(raw) + '일 전') +
      (biz ? ' · 영업일 기준' : '') + (inc ? ' · 초일 산입' : '') + '</p>' +
      '<p class="big" style="margin:8px 0 4px">' + iso(target) + '</p>' +
      '<p style="margin:0; font-size:14px; opacity:.85">' + label(target) + '</p>' +
      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px">' +
        '<div class="stat"><div class="k">실제 경과 일수</div><div class="v">' + n(Math.abs(gap)) + '일</div></div>' +
        '<div class="stat"><div class="k">주 단위</div><div class="v">' + (Math.abs(gap) / 7).toFixed(1) + '주</div></div>' +
      '</div>';

    return iso(base) + ' 기준 ' + raw + '일 → ' + iso(target) + ' (' + DOW[target.day()] + ')';
  }

  /* ---------- 2. 두 날짜 차이 ---------- */
  function calcDiff() {
    let a = D(document.getElementById('dFrom').value);
    let b = D(document.getElementById('dTo').value);
    const box = document.getElementById('diffRes');

    if (!a || !b || !a.isValid() || !b.isValid()) {
      box.innerHTML = '<p class="cap">두 날짜를 모두 입력해 주세요</p>';
      return '';
    }
    let swapped = false;
    if (b.isBefore(a)) { const t = a; a = b; b = t; swapped = true; }

    const inc = document.getElementById('dInc').checked;
    const rawDays = b.diff(a, 'day');
    const days = rawDays + (inc ? 1 : 0);

    // 몇 년 몇 개월 며칠인지 단계별로 떼어낸다
    let years = b.diff(a, 'year');
    let after = a.add(years, 'year');
    let months = b.diff(after, 'month');
    after = after.add(months, 'month');
    let rest = b.diff(after, 'day');

    const totalMonths = b.diff(a, 'month');

    box.innerHTML =
      '<p class="cap">' + iso(a) + ' → ' + iso(b) + (swapped ? ' (앞뒤를 바꿔 계산)' : '') +
      (inc ? ' · 초일 산입' : '') + '</p>' +
      '<p class="big" style="margin:8px 0 4px">' + n(days) + '일</p>' +
      '<p style="margin:0; font-size:14px; opacity:.85">' +
        (years ? years + '년 ' : '') + (months ? months + '개월 ' : '') + rest + '일' + '</p>' +
      '<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:14px">' +
        '<div class="stat"><div class="k">개월</div><div class="v">' + n(totalMonths) + '</div></div>' +
        '<div class="stat"><div class="k">주</div><div class="v">' + (rawDays / 7).toFixed(1) + '</div></div>' +
        '<div class="stat"><div class="k">시간</div><div class="v">' + n(rawDays * 24) + '</div></div>' +
      '</div>';

    return iso(a) + ' ~ ' + iso(b) + ' = ' + days + '일 (' +
           (years ? years + '년 ' : '') + (months ? months + '개월 ' : '') + rest + '일)';
  }

  /* ---------- 3. 나이 · 연차 ---------- */
  function calcAge() {
    const b = D(document.getElementById('gBirth').value);
    const base = D(document.getElementById('gBase').value);
    const box = document.getElementById('ageRes');

    if (!b || !base || !b.isValid() || !base.isValid()) {
      box.innerHTML = '<p class="cap">날짜를 입력해 주세요</p>';
      return '';
    }
    if (b.isAfter(base)) {
      box.innerHTML = '<p class="cap">기준일이 시작일보다 앞섭니다</p>';
      return '';
    }

    let years = base.diff(b, 'year');
    let after = b.add(years, 'year');
    let months = base.diff(after, 'month');
    after = after.add(months, 'month');
    const days = base.diff(after, 'day');

    const totalDays = base.diff(b, 'day');
    const korAge = base.year() - b.year() + 1;              // 세는나이
    const yearAge = base.year() - b.year();                 // 연나이

    // 다음 생일까지
    let next = b.year(base.year());
    if (next.isBefore(base, 'day')) next = next.add(1, 'year');
    const toBirthday = next.diff(base, 'day');

    box.innerHTML =
      '<p class="cap">' + iso(b) + ' 기준 · ' + iso(base) + ' 시점</p>' +
      '<p class="big" style="margin:8px 0 4px">만 ' + years + '세</p>' +
      '<p style="margin:0; font-size:14px; opacity:.85">근속·경과 ' +
        years + '년 ' + months + '개월 ' + days + '일</p>' +
      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px">' +
        '<div class="stat"><div class="k">총 일수</div><div class="v">' + n(totalDays) + '일</div></div>' +
        '<div class="stat"><div class="k">다음 생일·기념일까지</div><div class="v">' + (toBirthday === 0 ? '오늘' : toBirthday + '일') + '</div></div>' +
        '<div class="stat"><div class="k">세는나이</div><div class="v">' + korAge + '세</div></div>' +
        '<div class="stat"><div class="k">연나이</div><div class="v">' + yearAge + '세</div></div>' +
      '</div>';

    return iso(b) + ' → ' + iso(base) + ' : 만 ' + years + '세 (' + years + '년 ' + months + '개월 ' + days + '일)';
  }

  /* ---------- 갱신 ---------- */
  let lastText = '';
  function update() {
    if (!window.dayjs) return;
    if (tab === 'add') lastText = calcAdd();
    else if (tab === 'diff') lastText = calcDiff();
    else lastText = calcAge();
  }

  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.dataset.tab;
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === b); });
      ['add', 'diff', 'age'].forEach(function (k) {
        document.getElementById('tab-' + k).style.display = (k === tab) ? 'block' : 'none';
      });
      update();
    });
  });

  document.querySelectorAll('[data-quick]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.getElementById('aDays').value = b.dataset.quick;
      update();
    });
  });

  ['aBase','aDays','aBiz','aInc','dFrom','dTo','dInc','gBirth','gBase'].forEach(function (id) {
    const el = document.getElementById(id);
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });

  document.getElementById('todayBtn').addEventListener('click', function () {
    const t = todayStr();
    if (tab === 'add') document.getElementById('aBase').value = t;
    else if (tab === 'diff') { document.getElementById('dFrom').value = t; document.getElementById('dTo').value = t; }
    else document.getElementById('gBase').value = t;
    update();
    toast('오늘 날짜로 맞췄습니다');
  });

  document.getElementById('copyBtn').addEventListener('click', async function () {
    if (!lastText) { toast('복사할 결과가 없습니다'); return; }
    try {
      if (navigator.clipboard) await navigator.clipboard.writeText(lastText);
      else throw new Error('no clipboard');
      toast('복사되었습니다!');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = lastText; ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
      toast(ok ? '복사되었습니다!' : '복사가 막혔습니다');
    }
  });

  /* ---------- 시작값 ---------- */
  const t = todayStr();
  document.getElementById('aBase').value = t;
  document.getElementById('dFrom').value = t;
  document.getElementById('dTo').value = window.dayjs ? dayjs().add(30, 'day').format('YYYY-MM-DD') : t;
  document.getElementById('gBirth').value = '1990-01-01';
  document.getElementById('gBase').value = t;
  update();
})();
</script>
</body>
</html>
