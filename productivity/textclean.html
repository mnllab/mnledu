<style>
  :root{
    --ink:#26384B; --steel:#2C6BA0; --muted:#5F7488;
    --hair:#E3E7EC; --canvas:#F4F6F8;
  }
  html,body{ margin:0; }
  body{
    background:var(--canvas); color:var(--ink);
    font-family:'Pretendard',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  textarea{
    width:100%;
    border:0; outline:none; resize:vertical;
    background:transparent; color:var(--ink);
    font-family:inherit; font-size:15px; line-height:1.75;
    min-height:clamp(160px, 24vh, 260px);
  }
  textarea::placeholder{ color:#9AA7B4; }
  #output{ color:var(--ink); }

  /* 토글 스위치 */
  .switch{ position:relative; width:38px; height:22px; flex:none; }
  .switch input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .track{
    position:absolute; inset:0; border-radius:999px;
    background:#D6DDE4; transition:background .16s ease;
    pointer-events:none;
  }
  .knob{
    position:absolute; top:3px; left:3px;
    width:16px; height:16px; border-radius:999px; background:#fff;
    box-shadow:0 1px 2px rgba(38,56,75,.25);
    transition:transform .16s ease;
    pointer-events:none;
  }
  .switch input:checked ~ .track{ background:var(--steel); }
  .switch input:checked ~ .knob{ transform:translateX(16px); }
  .switch input:focus-visible ~ .track{ outline:2px solid var(--steel); outline-offset:2px; }

  .opt{
    display:flex; align-items:flex-start; gap:12px;
    border:1px solid var(--hair); border-radius:8px;
    background:#fff; padding:14px 16px;
    cursor:pointer; transition:border-color .12s, background .12s;
  }
  .opt:hover{ border-color:#C3CCD6; }
  .opt.on{ border-color:var(--steel); background:#F7FAFC; }

  .btn{
    border:1px solid var(--hair); background:#fff; color:var(--ink);
    border-radius:6px; font-size:13px; line-height:1;
    padding:8px 12px; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .btn:hover{ border-color:#C3CCD6; background:#FAFBFC; }
  .btn:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }

  #toast{
    opacity:0; transform:translate(-50%, 10px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<body class="font-sans text-ink">

<div class="mx-auto max-w-3xl px-4 sm:px-6 py-8 sm:py-12">

  <header class="mb-6 flex items-end justify-between gap-4">
    <div>
      <h1 class="text-[19px] font-semibold tracking-tight">텍스트 정제 툴</h1>
      <p class="mt-1 text-[13px] text-muted">붙여넣은 텍스트를 실시간으로 정리 · 저장되지 않음</p>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <button id="sampleBtn" class="btn">예시</button>
      <button id="clearBtn" class="btn">지우기</button>
    </div>
  </header>

  <!-- 원본 -->
  <section class="rounded-lg border border-hair bg-white shadow-[0_1px_2px_rgba(38,56,75,.05)]">
    <div class="border-b border-hair px-5 py-3 text-[12px] font-medium tracking-wide text-muted">원본</div>
    <div class="px-5 pt-4 sm:px-6">
      <textarea id="input" placeholder="정제할 텍스트를 입력하세요" spellcheck="false"></textarea>
    </div>
    <div class="flex flex-wrap gap-x-5 gap-y-1 border-t border-hair px-5 py-2.5 text-[12px] text-muted sm:px-6">
      <span>공백 포함 <b id="inAll" class="num ml-0.5 font-medium text-ink">0</b></span>
      <span>공백 제외 <b id="inNoSp" class="num ml-0.5 font-medium text-ink">0</b></span>
    </div>
  </section>

  <!-- 옵션 -->
  <section class="my-5 grid gap-2.5 sm:grid-cols-2">
    <label class="opt" data-opt="A">
      <span class="switch"><input type="checkbox" id="optA" checked><span class="track"></span><span class="knob"></span></span>
      <span class="min-w-0">
        <span class="block text-[14px] font-medium leading-tight">모든 줄바꿈 제거</span>
        <span class="mt-1 block text-[12px] leading-snug text-muted">엔터를 공백 1칸으로 치환</span>
        <span class="cnt mt-1.5 hidden text-[11px] text-steel"></span>
      </span>
    </label>

    <label class="opt" data-opt="B">
      <span class="switch"><input type="checkbox" id="optB" checked><span class="track"></span><span class="knob"></span></span>
      <span class="min-w-0">
        <span class="block text-[14px] font-medium leading-tight">연속된 공백 압축</span>
        <span class="mt-1 block text-[12px] leading-snug text-muted">2칸 이상 공백을 1칸으로 통일</span>
        <span class="cnt mt-1.5 hidden text-[11px] text-steel"></span>
      </span>
    </label>

    <label class="opt" data-opt="C">
      <span class="switch"><input type="checkbox" id="optC"><span class="track"></span><span class="knob"></span></span>
      <span class="min-w-0">
        <span class="block text-[14px] font-medium leading-tight">HTML 태그 제거</span>
        <span class="mt-1 block text-[12px] leading-snug text-muted">꺾쇠 안의 태그를 모두 삭제</span>
        <span class="cnt mt-1.5 hidden text-[11px] text-steel"></span>
      </span>
    </label>

    <label class="opt" data-opt="D">
      <span class="switch"><input type="checkbox" id="optD"><span class="track"></span><span class="knob"></span></span>
      <span class="min-w-0">
        <span class="block text-[14px] font-medium leading-tight">특수문자 제거</span>
        <span class="mt-1 block text-[12px] leading-snug text-muted">한글·영문·숫자·마침표·쉼표·공백만 유지</span>
        <span class="cnt mt-1.5 hidden text-[11px] text-steel"></span>
      </span>
    </label>
  </section>

  <!-- 결과 -->
  <section class="relative rounded-lg border border-hair bg-white shadow-[0_1px_2px_rgba(38,56,75,.05)]">
    <div class="border-b border-hair px-5 py-3 text-[12px] font-medium tracking-wide text-muted">결과</div>

    <button id="copyBtn"
      class="absolute right-4 top-2.5 z-10 rounded-md bg-ink px-3.5 py-2 text-[12px] font-medium text-white shadow-sm hover:bg-[#1D2C3B] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-steel">
      결과 복사
    </button>

    <div class="px-5 pt-4 sm:px-6">
      <textarea id="output" readonly spellcheck="false" placeholder="정제된 결과가 여기에 표시됩니다"></textarea>
    </div>
    <div class="flex flex-wrap gap-x-5 gap-y-1 border-t border-hair px-5 py-2.5 text-[12px] text-muted sm:px-6">
      <span>공백 포함 <b id="outAll" class="num ml-0.5 font-medium text-ink">0</b></span>
      <span>공백 제외 <b id="outNoSp" class="num ml-0.5 font-medium text-ink">0</b></span>
      <span id="delta" class="num"></span>
    </div>
  </section>

  <footer class="mt-8 text-center text-[11px] tracking-wide text-muted">
    © 2026 Janggil Kim. All rights reserved.
  </footer>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 rounded-md bg-ink px-4 py-2.5 text-[13px] font-medium text-white shadow-lg" role="status" aria-live="polite"></div>

<script>
(function () {
  const input   = document.getElementById('input');
  const output  = document.getElementById('output');
  const optA    = document.getElementById('optA');
  const optB    = document.getElementById('optB');
  const optC    = document.getElementById('optC');
  const optD    = document.getElementById('optD');
  const opts    = { A: optA, B: optB, C: optC, D: optD };

  const inAll   = document.getElementById('inAll');
  const inNoSp  = document.getElementById('inNoSp');
  const outAll  = document.getElementById('outAll');
  const outNoSp = document.getElementById('outNoSp');
  const delta   = document.getElementById('delta');

  /* ---------- 정제 파이프라인 ---------- */
  // 적용 순서 : 태그 제거 → 특수문자 제거 → 줄바꿈 제거 → 공백 압축
  // 앞 단계가 만들어 낸 빈칸까지 마지막 공백 압축이 정리하도록 배치
  function clean(text) {
    const removed = { A: 0, B: 0, C: 0, D: 0 };
    let t = text;

    if (optC.checked) {
      const m = t.match(/<[^>]*>/g);
      removed.C = m ? m.length : 0;
      t = t.replace(/<[^>]*>/g, '');
    }

    if (optD.checked) {
      const m = t.match(/[^가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9.,\s]/g);
      removed.D = m ? m.length : 0;
      t = t.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9.,\s]/g, '');
    }

    if (optA.checked) {
      const m = t.match(/\r\n|[\r\n]/g);
      removed.A = m ? m.length : 0;
      t = t.replace(/\r\n|[\r\n]/g, ' ');
    }

    if (optB.checked) {
      const m = t.match(/[ \t]{2,}/g);
      removed.B = m ? m.reduce(function (s, x) { return s + x.length - 1; }, 0) : 0;
      t = t.replace(/[ \t]{2,}/g, ' ');
      t = t.replace(/[ \t]+$/gm, '').replace(/^[ \t]+/gm, ''); // 줄 앞뒤 잔여 공백 정리
    }

    return { text: t, removed: removed };
  }

  /* ---------- 통계 ---------- */
  function countAll(s) { return Array.from(s.replace(/\r/g, '').replace(/\n/g, '')).length; }
  function countNoSp(s) { return Array.from(s.replace(/\s/g, '')).length; }
  function fmt(n) { return n.toLocaleString('ko-KR'); }

  const LABEL = { A: '줄바꿈', B: '공백', C: '태그', D: '특수문자' };

  function run() {
    const src = input.value;
    const result = clean(src);
    output.value = result.text;

    const a = countAll(src);
    inAll.textContent = fmt(a);
    inNoSp.textContent = fmt(countNoSp(src));

    const b = countAll(result.text);
    outAll.textContent = fmt(b);
    outNoSp.textContent = fmt(countNoSp(result.text));

    if (a > 0 && b < a) {
      delta.textContent = '−' + fmt(a - b) + ' (' + Math.round((1 - b / a) * 100) + '%)';
      delta.className = 'num text-muted';
    } else {
      delta.textContent = '';
    }

    // 옵션별 처리 건수
    document.querySelectorAll('.opt').forEach(function (el) {
      const key = el.dataset.opt;
      const on = opts[key].checked;
      el.classList.toggle('on', on);
      const cnt = el.querySelector('.cnt');
      const n = result.removed[key];
      if (on && n > 0) {
        cnt.textContent = LABEL[key] + ' ' + fmt(n) + '건 처리';
        cnt.classList.remove('hidden');
      } else {
        cnt.classList.add('hidden');
      }
    });
  }

  input.addEventListener('input', run);
  Object.keys(opts).forEach(function (k) { opts[k].addEventListener('change', run); });

  /* ---------- 토스트 ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------- 결과 복사 ---------- */
  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  document.getElementById('copyBtn').addEventListener('click', async function () {
    const text = output.value;
    if (!text.trim()) { toast('복사할 결과가 없습니다'); return; }
    try {
      if (navigator.clipboard) await navigator.clipboard.writeText(text);
      else throw new Error('no clipboard api');
      toast('복사 완료!');
    } catch (e) {
      if (legacyCopy(text)) toast('복사 완료!');
      else toast('브라우저가 막았습니다. 드래그해서 복사하세요');
    }
  });

  /* ---------- 지우기 · 예시 ---------- */
  document.getElementById('clearBtn').addEventListener('click', function () {
    input.value = '';
    input.focus();
    run();
  });

  document.getElementById('sampleBtn').addEventListener('click', function () {
    input.value =
      '<p class="lead">본  사업은   지역   창업기업의</p>\n' +
      '<span>스케일업을 지원하기 위한 프로그램임 ※ 붙임 참조</span>\n\n' +
      '□ 지원규모 : 최대 5천만원   /   ○ 신청기간 : 2026. 9. 1. ~ 9. 30.';
    run();
    input.focus();
  });

  run();
  input.focus();
})();
</script>
</body>
