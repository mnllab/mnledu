<body class="font-sans text-ink">

<div class="mx-auto max-w-6xl px-4 sm:px-6 py-8 sm:py-12">

  <header class="mb-6 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-[19px] font-semibold tracking-tight">PDF 줄바꿈 복원기</h1>
      <p class="mt-1 text-[13px] text-muted">PDF에서 끊긴 줄을 문단 단위로 되돌립니다 · 저장되지 않음</p>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <button id="sampleBtn" class="btn">예시</button>
      <button id="resetBtn" class="btn">초기화</button>
      <button id="copyBtn" class="btn btn-primary">결과 복사</button>
    </div>
  </header>

  <!-- 옵션 -->
  <div class="mb-4 flex flex-wrap items-center gap-x-6 gap-y-2 rounded-lg border border-hair bg-white px-5 py-3 text-[13px]">
    <label class="opt"><input type="checkbox" id="optKo" checked>한글 줄은 공백 없이 잇기</label>
    <label class="opt"><input type="checkbox" id="optList" checked>목록·번호 줄은 줄바꿈 유지</label>
    <span class="ml-auto flex items-center gap-2 text-muted">
      <label for="copyFmt">복사 형식</label>
      <select id="copyFmt" class="btn py-1.5 text-[13px]">
        <option value="blank" selected>문단 사이 빈 줄 유지</option>
        <option value="tight">빈 줄 없이 문단만 구분</option>
        <option value="single">전체를 한 문단으로</option>
      </select>
    </span>
  </div>

  <!-- 본문 -->
  <div class="grid gap-4 md:grid-cols-2">

    <section class="rounded-lg border border-hair bg-white shadow-[0_1px_2px_rgba(38,56,75,.04)]">
      <div class="flex items-center justify-between gap-3 border-b border-hair px-5 py-2.5">
        <span class="text-[12px] font-medium tracking-wide text-muted">원본</span>
        <button id="clearInput" class="btn px-2.5 py-1.5 text-[12px]">지우기</button>
      </div>
      <div class="px-5 pt-4 sm:px-6">
        <textarea id="input" placeholder="PDF에서 복사한 텍스트를 붙여넣으세요" spellcheck="false"></textarea>
      </div>
      <div class="flex flex-wrap gap-x-5 gap-y-1 border-t border-hair px-5 py-2.5 text-[12px] text-muted sm:px-6">
        <span>글자 <b id="inChars" class="num ml-0.5 font-medium text-ink">0</b></span>
        <span>줄 <b id="inLines" class="num ml-0.5 font-medium text-ink">0</b></span>
      </div>
    </section>

    <section class="rounded-lg border border-hair bg-white shadow-[0_1px_2px_rgba(38,56,75,.04)]">
      <div class="flex items-center justify-between gap-3 border-b border-hair px-5 py-2.5">
        <span class="text-[12px] font-medium tracking-wide text-muted">복원 결과</span>
        <button id="copyPanel" class="btn btn-primary px-2.5 py-1.5 text-[12px]">복사하기</button>
      </div>
      <div class="px-5 pt-4 sm:px-6">
        <textarea id="output" readonly spellcheck="false" placeholder="복원된 텍스트가 여기에 표시됩니다"></textarea>
      </div>
      <div class="flex flex-wrap gap-x-5 gap-y-1 border-t border-hair px-5 py-2.5 text-[12px] text-muted sm:px-6">
        <span>글자 <b id="outChars" class="num ml-0.5 font-medium text-ink">0</b></span>
        <span>문단 <b id="outParas" class="num ml-0.5 font-medium text-ink">0</b></span>
        <span id="fixInfo" class="num"></span>
      </div>
    </section>
  </div>

  <footer class="mt-8 text-center text-[11px] tracking-wide text-muted">

  </footer>

<div id="toast" class="fixed bottom-8 left-1/2 rounded-md bg-ink px-4 py-2.5 text-[13px] font-medium text-white shadow-lg" role="status" aria-live="polite"></div>

<script>
(function () {
  const input    = document.getElementById('input');
  const output   = document.getElementById('output');
  const optKo    = document.getElementById('optKo');
  const optList  = document.getElementById('optList');
  const inChars  = document.getElementById('inChars');
  const inLines  = document.getElementById('inLines');
  const outChars = document.getElementById('outChars');
  const outParas = document.getElementById('outParas');
  const fixInfo  = document.getElementById('fixInfo');

  // 목록·번호로 시작하는 줄 : 이런 줄은 앞줄과 이어 붙이면 안 된다
  const LIST_HEAD = /^\s*(?:[□■○●◇◆▪·•\-*]|\(?\d{1,2}[.)]|[①-⑳]|[가-힣]\.|[a-zA-Z][.)])\s/;

  const CJK = '\\u3131-\\u318E\\uAC00-\\uD7A3\\u4E00-\\u9FFF';

  function restore(src) {
    const stats = { hyphen: 0, joined: 0 };

    let text = src.replace(/\r\n?/g, '\n');

    // 3단계 : 빈 줄이 두 번 이상이면 진짜 문단 경계이므로 블록으로 잘라 따로 처리
    const blocks = text.split(/\n{2,}/);

    const done = blocks.map(function (block) {
      let b = block;

      // 1단계 : 줄 끝 하이픈으로 잘린 단어를 붙인다
      // 영문 소문자로 이어지는 경우만 처리해서 '2026-\n2027' 같은 표기는 건드리지 않는다
      b = b.replace(/([A-Za-z])[-‐–]\n[ \t]*([a-z])/g, function (m, a, c) {
        stats.hyphen++;
        return a + c;
      });

      // 2단계 : 문장 중간에서 끊긴 단일 줄바꿈을 잇는다
      b = b.replace(/\n[ \t]*/g, function (m, offset, whole) {
        const before = whole.slice(0, offset);
        const after = whole.slice(offset + m.length);

        // 목록·번호로 시작하는 줄은 그대로 줄을 유지한다
        if (optList.checked && LIST_HEAD.test(after)) return '\n';

        const prev = before.slice(-1);
        const next = after.slice(0, 1);
        if (!prev || !next) return '\n';

        stats.joined++;

        // 한글끼리 이어지는 줄은 공백 없이 붙인다 (PDF 한글은 원래 붙어 있던 문장)
        if (optKo.checked) {
          const cjkPrev = new RegExp('[' + CJK + ']').test(prev);
          const cjkNext = new RegExp('[' + CJK + ']').test(next);
          if (cjkPrev && cjkNext) return '';
        }
        return ' ';
      });

      // 4단계 : 이 과정에서 생긴 연속 공백을 한 칸으로 정리
      b = b.replace(/[ \t]{2,}/g, ' ');
      b = b.replace(/[ \t]+$/gm, '').replace(/^[ \t]+/gm, '');

      return b.trim();
    }).filter(function (b) { return b.length > 0; });

    return { text: done.join('\n\n'), stats: stats, paras: done.length };
  }

  function fmt(n) { return n.toLocaleString('ko-KR'); }

  function run() {
    const src = input.value;
    const r = restore(src);
    output.value = r.text;

    inChars.textContent = fmt(Array.from(src.replace(/\n/g, '')).length);
    inLines.textContent = fmt(src ? src.split('\n').length : 0);
    outChars.textContent = fmt(Array.from(r.text.replace(/\n/g, '')).length);
    outParas.textContent = fmt(r.paras);

    const parts = [];
    if (r.stats.joined) parts.push('줄 잇기 ' + fmt(r.stats.joined));
    if (r.stats.hyphen) parts.push('하이픈 ' + fmt(r.stats.hyphen));
    fixInfo.textContent = parts.join(' · ');
    fixInfo.className = 'num text-muted';
  }

  input.addEventListener('input', run);
  optKo.addEventListener('change', run);
  optList.addEventListener('change', run);

  /* ---------- 토스트 ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  /* ---------- 복사 ---------- */
  // 워드·한글은 CRLF를 문단 구분으로 읽는다.
  // LF 하나만 넘기면 문단이 통째로 붙거나, 빈 줄이 빈 문단으로 남아 한 줄이 더 생긴다.
  function forClipboard(text) {
    if (!text) return '';
    const mode = document.getElementById('copyFmt').value;
    const paras = text.split(/\n{2,}/).map(function (p) { return p.trim(); }).filter(Boolean);

    if (mode === 'single') {
      // 문단 구분 없이 한 덩어리로 (표 셀이나 한 칸 입력란에 넣을 때)
      return paras.join(' ').replace(/\n[ \t]*/g, ' ').replace(/[ \t]{2,}/g, ' ');
    }

    const sep = mode === 'tight' ? '\r\n' : '\r\n\r\n';
    return paras.map(function (p) { return p.replace(/\n/g, '\r\n'); }).join(sep);
  }

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  async function doCopy() {
    if (!output.value.trim()) { toast('복사할 결과가 없습니다'); return; }
    const text = forClipboard(output.value);
    try {
      if (navigator.clipboard) await navigator.clipboard.writeText(text);
      else throw new Error('no clipboard api');
      toast('깔끔하게 복사되었습니다!');
    } catch (e) {
      if (legacyCopy(text)) toast('깔끔하게 복사되었습니다!');
      else toast('브라우저가 막았습니다. 드래그해서 복사하세요');
    }
  }

  document.getElementById('copyBtn').addEventListener('click', doCopy);
  document.getElementById('copyPanel').addEventListener('click', doCopy);

  document.getElementById('clearInput').addEventListener('click', function () {
    input.value = '';
    run();
    input.focus();
  });

  /* ---------- 초기화 · 예시 ---------- */
  document.getElementById('resetBtn').addEventListener('click', function () {
    input.value = '';
    output.value = '';
    run();
    input.focus();
  });

  document.getElementById('sampleBtn').addEventListener('click', function () {
    input.value =
      'Recent advances in precision engineering have enabled sub-\n' +
      'micron positioning accuracy in industrial actuators. The infor-\n' +
      'mation obtained from these measurements is used to compen-\n' +
      'sate thermal drift.\n' +
      '\n' +
      '본 연구는 정밀 이송계의 열변형 보상 기법을 다룬다. 측정된 온도\n' +
      '분포를 기반으로 실시간 보정값을 산출하며, 기존 방식 대비 위치\n' +
      '오차를 유의미하게 줄였다.\n' +
      '\n' +
      '□ 지원규모 : 최대 5천만원\n' +
      '○ 신청기간 : 2026. 9. 1. ~ 9. 30.\n' +
      '① 사업계획서 ② 사업자등록증';
    run();
    input.focus();
  });

  run();
  input.focus();
})();
</script>
