<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안내 | 문의·상담 운영 종료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f1115;
            --paper: #fbfaf7;
            --gold: #e0a526;
            --gold-deep: #b8821a;
            --line: #e7e3da;
        }
        * { -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'IBM Plex Sans KR', sans-serif;
            background: var(--paper);
            color: #20242c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .serif { font-family: 'Gowun Batang', 'IBM Plex Sans KR', serif; }
        .notice {
            background:
                radial-gradient(120% 90% at 85% -10%, rgba(224,165,38,0.16), transparent 55%),
                linear-gradient(155deg, #14171d 0%, #0f1115 60%, #0b0d11 100%);
            position: relative;
            overflow: hidden;
        }
        .notice::after {
            content: "";
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: radial-gradient(80% 80% at 50% 25%, black, transparent 80%);
            pointer-events: none;
        }
        .reveal { opacity: 0; transform: translateY(16px); animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
        .d1 { animation-delay: .05s } .d2 { animation-delay: .2s } .d3 { animation-delay: .35s } .d4 { animation-delay: .5s }
        @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <main class="w-full max-w-2xl">
        <section class="notice rounded-3xl text-white px-8 py-14 sm:px-14 sm:py-20 shadow-xl text-center">
            <div class="relative z-10">
                <span class="reveal d1 inline-block text-amber-400 tracking-[0.35em] text-xs font-semibold uppercase mb-6">Notice</span>

                <h1 class="reveal d2 serif text-3xl sm:text-4xl font-bold leading-snug mb-8">
                    문의 및 상담 창구<br>운영 종료 안내
                </h1>

                <span class="reveal d2 block w-12 h-[3px] bg-amber-500 rounded-full mx-auto mb-8"></span>

                <p class="reveal d3 text-gray-300 leading-loose text-[16px] mb-6">
                    그동안 따뜻한 관심과 신뢰로 찾아주신 모든 분들께<br class="hidden sm:block">
                    진심으로 감사드립니다.
                </p>

                <p class="reveal d3 text-gray-300 leading-loose text-[16px] mb-6">
                    기존의 온라인 상담 창구는 더 이상 운영하지 않으며,<br class="hidden sm:block">
                    개인 및 기업 컨설팅·멘토링은 진행하지 않습니다.
                </p>

                <p class="reveal d4 text-gray-300 leading-loose text-[16px]">
                    다만 외부 강연, 심사·평가, 채널 협업 등의 제안은<br class="hidden sm:block">
                    아래 이메일로 남겨주시면 검토 후 회신드리겠습니다.
                </p>

                <a href="mailto:contact@mnlbiz.com"
                   class="reveal d4 inline-flex items-center gap-2 mt-6 px-6 py-3 rounded-full border border-amber-500/50 text-amber-300 hover:bg-amber-500 hover:text-[#0f1115] transition-colors font-semibold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    contact@mnlbiz.com
                </a>

                <p class="reveal d4 serif italic text-amber-300 text-xl mt-12">
                    감사합니다.
                </p>
            </div>
        </section>
    </main>
</body>
</html>
